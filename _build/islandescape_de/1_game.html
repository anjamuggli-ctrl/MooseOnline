  <style>
  .ie{--ie-ink:#1f2b33;--ie-mut:#5f6b70;--ie-line:#d6dde0;--ie-acc:#2a6f97;--ie-warn:#c0572b;--ie-ok:#4f8a52;color:var(--ie-ink)}

  .ie-steps{list-style:none;padding:0;margin:12px 0;display:grid;gap:8px}

  .ie-steps .mv{display:flex;flex-direction:column;gap:3px;flex:none}

  .ie-poster{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin:12px 0;background:#2e3b44;border-radius:12px;padding:12px}
  .ie-poster div{background:#f7f3e8;border-radius:8px;padding:9px 11px;font-size:14.5px;display:flex;gap:10px;align-items:center}
  .ie-poster b{font:800 22px/1 ui-monospace,Menlo,monospace;color:var(--ie-warn)}
  .ie-lock{margin:18px 0 6px;background:#20303a;color:#fff;border-radius:16px;padding:16px 18px}

  .ie-lock p{margin:4px 0 10px;font-size:14.5px;color:#cfdbe2}
  .ie-digits{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}

  .ie-digits input{width:52px;height:60px;border-radius:10px;border:2px solid #56656f;background:#0f1a20;color:#fff;font:800 28px/1 ui-monospace,Menlo,monospace;text-align:center}
  .ie-digits input:focus{border-color:#ffd55a;outline:none}
  .ie-msg{min-height:1.5em;margin-top:10px;font-weight:700}
  .ie-msg.no{color:#ffb4a0}.ie-msg.ok{color:#b8f0b0}
  .ie-shake{animation:ie-shake .4s}
  @keyframes ie-shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
  .ie-sw{display:grid;gap:8px;margin:12px 0}
  .ie-sw label{display:flex;align-items:center;gap:12px;background:#f4f7f8;border:1.5px solid var(--ie-line);border-radius:12px;padding:9px 12px;cursor:pointer}
  .ie-sw input{position:absolute;opacity:0;pointer-events:none}
  .ie-sw .tg{width:52px;height:28px;border-radius:999px;background:#9aa6ad;position:relative;flex:none;transition:.25s}

  .ie-sw input:checked+.tg{background:var(--ie-ok)}

  .ie-lever{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .ie-lever button{background:#c0392b;border:0;color:#fff;font:800 16px/1 inherit;border-radius:14px;padding:16px 24px;cursor:pointer;box-shadow:0 5px 0 #7d2219;letter-spacing:.04em}
  .ie-lever button:active{transform:translateY(4px);box-shadow:0 1px 0 #7d2219}
  .ie-meter{display:flex;gap:5px}.ie-meter i{width:18px;height:18px;border-radius:50%;background:#3b4a55;border:2px solid #56656f}.ie-meter i.on{background:#ffd55a;border-color:#fff2b8}
  .ie-hint{background:#fff8e6;border-left:4px solid #e0a526;border-radius:8px;padding:9px 12px;margin:10px 0;font-size:15px}
  .ie-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
  .ie-stats div{background:#f4f7f8;border-radius:12px;padding:12px;text-align:center}
  .ie-stats b{display:block;font-size:26px;font-family:Georgia,serif}
  .ie-best{width:100%;border-collapse:collapse;font-size:14.5px;margin:8px 0}
  .ie-best td,.ie-best th{padding:6px 8px;border-bottom:1px solid var(--ie-line);text-align:left}
  .ie-done{background:#e3f1df;border-radius:12px;padding:12px 16px;margin:12px 0;font-weight:600}
  .ie-ov{position:fixed;inset:0;background:rgba(15,26,32,.6);display:flex;align-items:center;justify-content:center;z-index:100000;padding:14px}
  .ie-ovbox{background:#fff;border-radius:18px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:20px 22px;color:#1f2b33;line-height:1.5}
  .ie-ovbox li{margin:4px 0}
  </style>

  <div class="ie" id="ie"><noscript><p>Bitte JavaScript aktivieren, um das Spiel zu spielen.</p></noscript></div>

<script>
(function(){
"use strict";
var root = document.getElementById("ie");
var IMG = (window.SITE_BASE || (/\/(en|it|rm)\/[^\/]*$/.test(location.pathname) ? "../" : "")) + "img/pome24b/games/";
var KEY = "mo_islandescape_de_v1", BEST = "mo_islandescape_de_best_v1";
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function shuffle(a){ a = a.slice(); for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
var FALLBACK = {"ie-timeup.jpg":"ie-intro.jpg"};
function img(f, alt){ var fb = FALLBACK[f]; return '<img src="'+IMG+f+'" alt="'+esc(alt)+'"'+(fb?' data-fb="'+IMG+fb+'"':'')+' onerror="if(this.dataset.fb){this.src=this.dataset.fb;this.removeAttribute(\'data-fb\')}else this.remove()">'; }
function mmss(s){ s = Math.max(0, Math.round(s)); return Math.floor(s/60)+":"+("0"+(s%60)).slice(-2); }

var FACTS = '<div class="ie-fact"><b>Steckbrief: Insel Mira</b><ul><li>4000 Einwohnerinnen und Einwohner; im Sommer kommen etwa 4000 Touristinnen und Touristen dazu.</li><li>Etwa 2500 Sonnenstunden pro Jahr, vor allem im Sommer.</li><li>Starke Winde an der Westküste, besonders im Herbst und Winter.</li><li>Der Unterschied zwischen Ebbe und Flut beträgt nur etwa 1 Meter. Ein kleiner Fluss, keine Berge.</li><li>Ein Vogelschutzgebiet auf den Hügeln der Westküste.</li></ul></div>';
var RULES = '<b>Regeln:</b> Jeder falsche Code kostet <b>1 Minute</b>. In jedem Raum gibt es einen Hinweis, der <b>2 Minuten</b> kostet. Besprecht euch im Team!';
var HOWTO = '<h3 style="margin-top:0">So wird gespielt</h3><ul><li>Ihr geht durch <b>vier Räume</b>. In jedem Raum löst ihr das Rätsel, findet den Code und gebt ihn im Schloss ein.</li><li>Raum 1: Bringt die Karten mit ▲ und ▼ in die richtige Reihenfolge. Raum 4: Schaltet die richtigen Aussagen EIN und zieht den Hebel.</li><li>Jeder falsche Code kostet <b>1 Minute</b>. In jedem Raum gibt es einen Hinweis, der <b>2 Minuten</b> kostet.</li><li>Die Lampen oben zeigen, wie viele Räume ihr gelöst habt. Euer Spiel wird in diesem Browser gespeichert.</li><li>Besprecht euch im Team!</li></ul>'+FACTS;

/* ================= RÄUME ================= */
var ROOMS = [
 {id:"weather", img:"ie-room1-weather.jpg", kick:"Raum 1 · Die Wetterstation", title:"Warum wird es auf der Insel wärmer?",
  story:"Die Tür der Wetterstation steht offen. Drinnen trommelt der Regen ans Fenster. Auf dem Pult hat die Meteorologin fünf Karten zum Treibhauseffekt liegen lassen, doch der Wind hat sie durcheinandergewirbelt. Auf jeder Karte ist eine Zahl gestempelt. Bringt die Karten in die richtige Reihenfolge: Die Zahlen ergeben dann den Code für die nächste Tür.",
  hint:"Beginnt mit der Sonne. Das Licht muss zuerst den Boden erreichen, bevor der Boden Wärme abgeben kann. Der Mensch kommt ganz am Schluss.",
  type:"order",
  items:[["Sonnenlicht durchquert die Atmosphäre und erreicht die Erde.","7"],["Land und Meere nehmen den grössten Teil des Sonnenlichts auf und erwärmen sich.","2"],["Die warme Oberfläche gibt Wärme als Infrarotstrahlung ab.","9"],["Treibhausgase halten einen Teil dieser Wärme zurück und senden sie zur Oberfläche zurück.","4"],["Der Mensch bringt zusätzliche Treibhausgase in die Luft, der Treibhauseffekt wird stärker und die Erde wärmer.","6"]],
  lock:{t:"Türcode", p:"Gebt die fünf gestempelten Zahlen in der richtigen Reihenfolge des Treibhauseffekts ein.", labels:["1.","2.","3.","4.","5."]},
  code:"72946", done:"Die Tür springt auf. Ein Windstoss weht euch zum Hafen."},
 {id:"harbour", img:"ie-room2-harbour.jpg", kick:"Raum 2 · Der Hafen", title:"Wie hoch muss der Damm sein?",
  story:"Wellen schlagen über den alten Steindamm. Der Schaltkasten der Hafenmeisterin ist verschlossen. Daneben hängt eine Liste mit sieben nummerierten Vorgängen. Der Code besteht aus den Nummern aller Vorgänge, die den Meeresspiegel wirklich steigen lassen, von der kleinsten zur grössten Nummer.",
  hint:"Nur Eis, das auf dem Land liegt, bringt neues Wasser ins Meer. Eis, das schon im Wasser schwimmt, ist wie ein Eiswürfel im Glas. Und denkt daran: Warmes Wasser braucht mehr Platz.",
  type:"list",
  items:["Schwimmendes Meereis in der Arktis schmilzt.","Meerwasser dehnt sich aus, wenn es wärmer wird.","Es fällt mehr Regen über dem Meer.","Der Eisschild auf Grönland schmilzt.","Eisberge, die schon im Meer treiben, schmelzen.","Gletscher in den Alpen schmelzen.","Der Eisschild der Antarktis schmilzt."],
  lock:{t:"Schaltkasten", p:"Die Nummern der Vorgänge, die den Meeresspiegel steigen lassen, von der kleinsten zur grössten.", labels:["","","",""]},
  code:"2467", done:"Der Schaltkasten öffnet sich, und die Pumpen laufen an. Das Wasser im Hafen sinkt langsam. Jetzt: ins Kraftwerkshaus!"},
 {id:"power", img:"ie-room3-powerhouse.jpg", kick:"Raum 3 · Das Kraftwerkshaus", title:"Jede Maschine wandelt Energie um",
  story:"Im Kraftwerkshaus hängt ein altes Plakat mit sechs Energieumwandlungen. Die Maschinen im Raum sind noch ausgeschaltet. Um sie wieder zu starten, fragt das Bedienfeld, welche Umwandlung jede Maschine ausführt. Findet für jede Maschine die passende Nummer.",
  hint:"Eine Solarzelle macht direkt aus Licht Strom (nicht aus Wärme). Ein Motor und ein Generator tun das Gegenteil voneinander: Der eine macht aus Strom Bewegung, der andere aus Bewegung Strom.",
  type:"poster",
  items:[["1","Bewegungsenergie → elektrische Energie"],["2","Lichtenergie → Wärme"],["3","chemische Energie → elektrische Energie"],["4","elektrische Energie → Bewegungsenergie"],["5","Lichtenergie → elektrische Energie"],["6","chemische Energie → Wärme und Licht"]],
  lock:{t:"Bedienfeld", p:"Welche Umwandlung führt jede Maschine aus? Gebt die Nummer vom Plakat ein.", labels:["Solarzelle","Elektromotor","Batterie (im Einsatz)","Generator"]},
  code:"5431", done:"Die Maschinen summen. Solaranlage, kleine Windturbine und Wasserrad sind wieder angeschlossen. Nur noch der Kontrollraum fehlt."},
 {id:"control", img:"ie-room4-control.jpg", kick:"Raum 4 · Der Kontrollraum", title:"Schaltet die Insel ein",
  story:"Der letzte Raum. Acht Schalter steuern das Energiesystem der Insel, und jeder trägt eine Aussage. Schaltet jede richtige Aussage EIN und lasst die falschen AUS. Dann zieht den Haupthebel. Ist die Einstellung falsch, zeigen die Lampen, wie viele Schalter richtig stehen.",
  hint:"Genau fünf Aussagen sind richtig. Die weisse Wolke über einem Kühlturm ist Wasserdampf, kein Rauch. Und Uran wird abgebaut: Es geht eines Tages aus.",
  type:"switch",
  items:[["Steuerstäbe fangen Neutronen ein und können die Kettenreaktion verlangsamen.",true],["Die weisse Wolke über einem Kühlturm ist Rauch voller CO₂.",false],["Kernenergie ist eine erneuerbare Energie.",false],["Die Insel Mira sollte kein Gezeitenkraftwerk bauen, weil der Tidenhub nur etwa 1 Meter beträgt.",true],["Batterien können Solarstrom vom Tag für die Nacht speichern.",true],["Eine Windturbine erzeugt bei jeder Windgeschwindigkeit Strom.",false],["Radioaktiver Abfall bleibt während Tausenden von Jahren gefährlich.",true],["Windturbinen in der Nähe des Vogelschutzgebiets können während des Vogelzugs abgeschaltet werden.",true]],
  done:"Der Haupthebel rastet ein. Eine Strassenlampe nach der anderen geht an …"}
];

/* ================= STATE ================= */
var S = null, tick = null;
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ return null; } }
function left(){ return S.limit ? S.limit - (Date.now() - S.t0)/1000 - S.pen : Infinity; }
function used(){ return (Date.now() - S.t0)/1000 + S.pen; }

/* ================= START ================= */
function start(){
 stop();
 var saved = load();
 root.innerHTML = '<div class="ie-panel"><div class="ie-hero">'+img("ie-intro.jpg","Eine kleine Insel nach einem Sturm, mit dunklen Häusern und einer stillstehenden Windturbine")+'<div class="cap"><small>Escape-Game · Energie und Umwelt</small><b>Island Escape: Strom für die Insel Mira</b></div></div><div class="ie-body">'
  +'<p>🇬🇧 <a href="pome24b-island-escape.html" style="text-decoration:underline">English version of the game</a></p><p>Letzte Nacht hat ein heftiger Sturm die <b>Insel Mira</b> getroffen. Das alte Dieselkraftwerk ist kaputt, die Häuser sind dunkel, und das neue, saubere Energiesystem der Insel ist verriegelt. Ihr seid das Energieteam, das mit dem Schiff zu Hilfe gekommen ist. Findet euren Weg durch <b>vier Räume</b>, löst die Rätsel und schaltet die Insel wieder ein, bevor die Nacht hereinbricht.</p>'
  +FACTS
  +'<p>'+RULES+'</p>'
  +(saved && !saved.end ? '<p><button class="ie-btn" id="ie-res">Gespeichertes Spiel fortsetzen (Raum '+(saved.room+1)+')</button></p>' : '')
  +'<div class="ie-row" style="margin:12px 0"><label for="ie-name"><b>Teamname</b></label><input class="ie-input" id="ie-name" maxlength="28" value="Das Energieteam"></div>'
  +'<p style="margin:8px 0 6px"><b>Zeit</b></p><div class="ie-chips" id="ie-time"><button data-m="20">20 Minuten · für Profis</button><button data-m="30" class="on">30 Minuten</button><button data-m="45">45 Minuten</button><button data-m="0">ohne Zeitlimit</button></div>'
  +'<p style="margin-top:18px"><button class="ie-btn" id="ie-go">Escape starten</button></p>'+bestTable()+'</div></div>';
 root.querySelector("#ie-time").addEventListener("click", function(e){ var b=e.target.closest("button"); if(!b) return; [].forEach.call(this.children,function(x){x.classList.toggle("on",x===b);}); });
 root.querySelector("#ie-go").addEventListener("click", function(){
  var m = +root.querySelector("#ie-time .on").dataset.m;
  S = {team:(root.querySelector("#ie-name").value.trim()||"Das Energieteam").slice(0,28), limit:m*60, t0:Date.now(), pen:0, room:0, hints:[], wrong:0, end:null, order:shuffle([0,1,2,3,4])};
  save(); room();
 });
 var r = root.querySelector("#ie-res"); if (r) r.addEventListener("click", function(){ S = saved; room(); });
}
function bestTable(){
 var b = []; try{ b = JSON.parse(localStorage.getItem(BEST)) || []; }catch(e){}
 if (!b.length) return "";
 return '<h3 style="margin-top:20px">Beste Teams auf diesem Gerät</h3><table class="ie-best"><tr><th>Team</th><th>Zeit</th><th>Hinweise</th><th>Falsche Codes</th></tr>'+b.slice(0,5).map(function(x){ return '<tr><td>'+esc(x.team)+'</td><td>'+mmss(x.time)+'</td><td>'+x.hints+'</td><td>'+x.wrong+'</td></tr>'; }).join("")+'</table>';
}

function help(){
 var d = document.createElement("div"); d.className = "ie-ov";
 d.innerHTML = '<div class="ie-ovbox" role="dialog" aria-modal="true">'+HOWTO+'<p style="text-align:right;margin:12px 0 0"><button class="ie-btn">Zurück zum Spiel</button></p></div>';
 root.appendChild(d);
 var close = function(){ d.remove(); document.removeEventListener("keydown", k); };
 var k = function(e){ if (e.key === "Escape") close(); };
 d.addEventListener("click", function(e){ if (e.target === d || e.target.closest("button")) close(); });
 document.addEventListener("keydown", k); d.querySelector("button").focus();
}

/* ================= TIMER ================= */
function stop(){ if (tick) clearInterval(tick); tick = null; }
function bar(){
 var h = '<div class="ie-bar"><span class="ie-clock" id="ie-clock">'+(S.limit?mmss(left()):mmss(used()))+'</span><div class="ie-lamps">'
  + ROOMS.map(function(r,i){ return '<span class="ie-lamp'+(i<S.room?' on':'')+(i===S.room?' now':'')+'" title="'+esc(r.kick)+'">'+(i+1)+'</span>'; }).join("")
  +'</div><span class="ie-team">'+esc(S.team)+'</span><button class="ie-btn alt sm" id="ie-help" style="background:transparent;color:#fff;border-color:#8aa0ad">📖 Regeln</button><button class="ie-btn alt sm" id="ie-quit" style="background:transparent;color:#fff;border-color:#8aa0ad">Neu starten</button></div>';
 return h;
}
function runClock(){
 stop();
 tick = setInterval(function(){
  var c = document.getElementById("ie-clock"); if (!c) return stop();
  if (S.limit) { var l = left(); c.textContent = mmss(l); c.classList.toggle("low", l < 120); if (l <= 0) { stop(); timeUp(); } }
  else c.textContent = mmss(used());
 }, 500);
}

/* ================= ROOM ================= */
function room(){
 if (S.end === "win") return win();
 if (S.limit && left() <= 0) return timeUp();
 var R = ROOMS[S.room];
 var h = bar() + '<div class="ie-panel"><div class="ie-hero">'+img(R.img, R.kick)+'<div class="cap"><small>'+esc(R.kick)+'</small><b>'+esc(R.title)+'</b></div></div><div class="ie-body"><p>'+esc(R.story)+'</p>';
 if (R.type === "order") {
  h += '<ol class="ie-steps" id="ie-order">' + S.order.map(function(k,pos){ return stepLi(R, k, pos); }).join("") + '</ol>';
 } else if (R.type === "list") {
  h += '<ul class="ie-list">'+R.items.map(function(t,i){ return '<li><span class="n">'+(i+1)+'</span><span>'+esc(t)+'</span></li>'; }).join("")+'</ul>';
 } else if (R.type === "poster") {
  h += '<div class="ie-poster" aria-label="Plakat mit sechs Energieumwandlungen">'+R.items.map(function(x){ return '<div><b>'+x[0]+'</b><span>'+esc(x[1])+'</span></div>'; }).join("")+'</div>';
 } else if (R.type === "switch") {
  h += '<div class="ie-sw" id="ie-sw">'+R.items.map(function(x,i){ return '<label><input type="checkbox" data-i="'+i+'"><span class="tg"></span><span>'+esc(x[0])+'</span></label>'; }).join("")+'</div>';
 }
 h += '<div id="ie-hintbox">'+(S.hints.indexOf(S.room)>=0?'<div class="ie-hint"><b>Hinweis:</b> '+esc(R.hint)+'</div>':'')+'</div>';
 if (R.type === "switch") {
  h += '<div class="ie-lock"><h4>Haupthebel</h4><p>Stellt die Schalter ein, dann zieht den Hebel. Falsche Einstellung: −1 Minute.</p><div class="ie-lever"><button id="ie-pull">⏻ HEBEL ZIEHEN</button><div class="ie-meter" id="ie-meter" aria-live="polite">'+R.items.map(function(){ return '<i></i>'; }).join("")+'</div></div><div class="ie-msg" id="ie-msg" aria-live="polite"></div></div>';
 } else {
  h += '<div class="ie-lock" id="ie-lock"><h4>🔒 '+esc(R.lock.t)+'</h4><p>'+esc(R.lock.p)+'</p><div class="ie-digits">'
   + R.lock.labels.map(function(l,i){ return '<label>'+'<input inputmode="numeric" maxlength="1" pattern="[0-9]" aria-label="Ziffer '+(i+1)+(l?' – '+esc(l):'')+'" data-d="'+i+'">'+(l?esc(l):'')+'</label>'; }).join("")
   + '<button class="ie-btn" id="ie-try" style="background:#ffd55a;color:#20303a;margin-left:6px">Öffnen</button></div><div class="ie-msg" id="ie-msg" aria-live="polite"></div></div>';
 }
 h += '<div class="ie-row" style="justify-content:space-between;margin-top:12px"><button class="ie-btn alt sm" id="ie-hint"'+(S.hints.indexOf(S.room)>=0?' disabled':'')+'>💡 Hinweis (−2 Minuten)</button><span style="color:var(--ie-mut);font-size:14px">Falsche Codes bisher: '+S.wrong+'</span></div></div></div>';
 root.innerHTML = h;
 runClock();
 root.querySelector("#ie-help").onclick = help;
 root.querySelector("#ie-quit").onclick = function(){ if (confirm("Escape-Game neu starten? Euer Fortschritt geht verloren.")) { try{localStorage.removeItem(KEY);}catch(e){} start(); } };
 root.querySelector("#ie-hint").onclick = function(){ if (S.hints.indexOf(S.room) < 0) { S.hints.push(S.room); S.pen += 120; save(); this.disabled = true; document.getElementById("ie-hintbox").innerHTML = '<div class="ie-hint"><b>Hinweis:</b> '+esc(R.hint)+'</div>'; } };
 if (R.type === "order") wireOrder(R);
 if (R.type === "switch") root.querySelector("#ie-pull").onclick = pull;
 else wireLock(R);
 window.scrollTo({top: root.getBoundingClientRect().top + window.scrollY - 80, behavior:"smooth"});
}
function stepLi(R, k, pos){
 return '<li data-k="'+k+'"><span class="n">'+(pos+1)+'</span><span class="tx">'+esc(R.items[k][0])+'</span><span class="dg" title="gestempelte Zahl">'+R.items[k][1]+'</span><span class="mv"><button data-m="-1" aria-label="Nach oben">▲</button><button data-m="1" aria-label="Nach unten">▼</button></span></li>';
}
function wireOrder(R){
 var ol = root.querySelector("#ie-order");
 ol.addEventListener("click", function(e){
  var b = e.target.closest("button[data-m]"); if (!b) return;
  var li = b.closest("li"), pos = [].indexOf.call(ol.children, li), to = pos + (+b.dataset.m);
  if (to < 0 || to >= S.order.length) return;
  var t = S.order[pos]; S.order[pos] = S.order[to]; S.order[to] = t; save();
  ol.innerHTML = S.order.map(function(k,p){ return stepLi(R,k,p); }).join("");
  var nb = ol.children[to].querySelector('button[data-m="'+b.dataset.m+'"]'); if (nb) nb.focus();
 });
}
function wireLock(R){
 var ins = [].slice.call(root.querySelectorAll(".ie-digits input"));
 ins.forEach(function(inp, i){
  inp.addEventListener("input", function(){ inp.value = inp.value.replace(/\D/g,"").slice(-1); if (inp.value && ins[i+1]) ins[i+1].focus(); });
  inp.addEventListener("keydown", function(e){ if (e.key === "Backspace" && !inp.value && ins[i-1]) ins[i-1].focus(); if (e.key === "Enter") tryCode(R, ins); });
 });
 root.querySelector("#ie-try").onclick = function(){ tryCode(R, ins); };
}
function tryCode(R, ins){
 var code = ins.map(function(x){ return x.value; }).join(""), msg = document.getElementById("ie-msg");
 if (code.length < ins.length) { msg.className = "ie-msg no"; msg.textContent = "Bitte alle "+ins.length+" Ziffern ausfüllen."; return; }
 if (code === R.code) return solved(R);
 S.wrong++; S.pen += 60; save();
 var lock = document.getElementById("ie-lock"); lock.classList.remove("ie-shake"); void lock.offsetWidth; lock.classList.add("ie-shake");
 msg.className = "ie-msg no"; msg.textContent = "Falscher Code! −1 Minute. Prüft das Rätsel nochmals.";
}
function pull(){
 var R = ROOMS[S.room], boxes = [].slice.call(root.querySelectorAll("#ie-sw input"));
 var right = boxes.filter(function(b){ return b.checked === R.items[+b.dataset.i][1]; }).length;
 var lamps = root.querySelectorAll("#ie-meter i");
 [].forEach.call(lamps, function(l,i){ l.classList.toggle("on", i < right); });
 var msg = document.getElementById("ie-msg");
 if (right === R.items.length) return solved(R);
 S.wrong++; S.pen += 60; save();
 msg.className = "ie-msg no"; msg.textContent = right+" von "+R.items.length+" Schaltern stehen richtig. −1 Minute. Bei welchen Aussagen seid ihr unsicher?";
}
function solved(R){
 stop();
 var msg = document.getElementById("ie-msg"); msg.className = "ie-msg ok"; msg.textContent = "✔ Richtig!";
 S.room++;
 if (S.room >= ROOMS.length) { S.end = "win"; S.time = used(); saveBest(); save(); setTimeout(win, 900); return; }
 save();
 var lamp = root.querySelectorAll(".ie-lamp")[S.room-1]; if (lamp) lamp.classList.add("on");
 var body = root.querySelector(".ie-body");
 body.insertAdjacentHTML("beforeend", '<div class="ie-done">'+esc(R.done)+'</div><p><button class="ie-btn" id="ie-next">Weiter zu Raum '+(S.room+1)+' →</button></p>');
 runClock();
 var nb = document.getElementById("ie-next"); nb.focus(); nb.onclick = room;
}
function saveBest(){
 var b = []; try{ b = JSON.parse(localStorage.getItem(BEST)) || []; }catch(e){}
 b.push({team:S.team, time:Math.round(S.time), hints:S.hints.length, wrong:S.wrong});
 b.sort(function(x,y){ return x.time - y.time; });
 try{ localStorage.setItem(BEST, JSON.stringify(b.slice(0,10))); }catch(e){}
}
function win(){
 stop();
 root.innerHTML = '<div class="ie-panel"><div class="ie-hero">'+img("ie-success.jpg","Die Insel bei Nacht, alle Lichter brennen")+'<div class="cap"><small>Mission erfüllt</small><b>Die Insel Mira leuchtet wieder!</b></div></div><div class="ie-body">'
  +'<p>Gut gemacht, <b>'+esc(S.team)+'</b>! Solaranlagen, Windturbinen und Batterien versorgen die Insel mit sauberem Strom, und das alte Dieselkraftwerk bleibt ausgeschaltet.</p>'
  +'<div class="ie-stats"><div><b>'+mmss(S.time)+'</b>Zeit (inkl. Strafminuten)</div><div><b>'+S.hints.length+'</b>Hinweise genutzt</div><div><b>'+S.wrong+'</b>falsche Codes</div></div>'
  +'<div class="ie-fact"><b>Was ihr in diesem Spiel gebraucht habt</b><ul><li>Raum 1: der Treibhauseffekt</li><li>Raum 2: der steigende Meeresspiegel</li><li>Raum 3: Energieumwandlung</li><li>Raum 4: Kernenergie, Windkraft und die Energieversorgung einer Insel</li></ul></div>'
  +'<p><b>Darüber sprechen:</b> Welchen Energiemix würdet ihr der Insel Mira empfehlen, und warum? Begründet eure Antwort im Team.</p>'
  +'<p><button class="ie-btn" id="ie-again">Nochmals spielen</button></p>'+bestTable()+'</div></div>';
 root.querySelector("#ie-again").onclick = function(){ try{localStorage.removeItem(KEY);}catch(e){} start(); };
}
function timeUp(){
 stop();
 root.innerHTML = '<div class="ie-panel"><div class="ie-hero">'+img("ie-timeup.jpg","Die dunkle Insel bei Nacht")+'<div class="cap"><small>Die Zeit ist um</small><b>Auf der Insel Mira ist es Nacht geworden</b></div></div><div class="ie-body">'
  +'<p>Die Insel ist noch dunkel, aber ihr seid weit gekommen: <b>'+S.room+' von 4 Räumen</b> sind gelöst. Ihr könnt ohne Zeitlimit weiterspielen und die Mission beenden oder neu beginnen.</p>'
  +'<p class="ie-row"><button class="ie-btn" id="ie-cont">Ohne Zeitlimit weiterspielen</button><button class="ie-btn alt" id="ie-again">Neu beginnen</button></p></div></div>';
 root.querySelector("#ie-cont").onclick = function(){ S.limit = 0; save(); room(); };
 root.querySelector("#ie-again").onclick = function(){ try{localStorage.removeItem(KEY);}catch(e){} start(); };
}
start();
})();
</script>
