 if (fd.k === "wissen" || fd.k === "pause" || fd.k === "weg") return wissen(r, fd.k === "pause" ? "Pausenaufsicht: " : fd.k === "weg" ? "Unterwegs auf dem Schulweg: " : "");
 if (fd.k === "alltag") return event(r);
 if (fd.k === "plus") { addT(r, 1); log(esc(pl(r))+": "+esc(fd.n.replace("­",""))+", +1 ⏱."); return info({title:fd.n.replace("­",""), icon:fd.ic, text:PLUS[f]+" +1 ⏱ diese Woche.", th:["eltern","intervention","praevention","faktoren"][f%4]}); }
 var tips = ["prozess","rollen","konflikt","lohnt","praevention","eltern","nba","faktoren","intervention","entwicklung","mobbing","gewalt","cyber","programme"];
 var tip = tips[(S.week*3 + f) % tips.length];
 return info({title: fd.k === "lehrer" ? "Austausch im Lehrerzimmer" : fd.k === "home" ? "Ruhiger Moment" : fd.n.replace("­",""), icon:fd.ic, img: fd.k==="home" ? RL[fd.r].img : null, text: fd.k === "lehrer" ? "Beim Kaffee tauscht ihr euch über eine Studie aus." : "Hier ist gerade alles ruhig. Du nutzt die Zeit, um nachzulesen.", th:tip});
}
function endTurn(){
 closeModal(); S.modal = null;
 S.ti++;
 if (S.ti >= ROLES.length) return endWeek();
 save(); render();
}
function startWeek(){
 S.week++; S.ti = 0;
 ROLES.forEach(function(r){ S.t[r] = TIME; });
 var neu = [];
 Object.keys(S.cs).forEach(function(id){ var s = S.cs[id]; if (!s.end && !s.mk && s.due <= S.week) { s.mk = {at:locOf(id, s.node), exp:S.week+FUSE, fresh:true}; neu.push(id); } });
 log("<b>Woche "+S.week+"</b>"+(neu.length ? ": neue Fälle bei "+neu.map(function(id){ return CASES[id].emo+" "+F[S.cs[id].mk.at].n.replace("­",""); }).join(", ") : ""));
 save(); render();
 if (S.week === 1) { var y = root.getBoundingClientRect().top + window.scrollY - 80; window.scrollTo({top:y, behavior:"smooth"}); }
 var b = document.createElement("div"); b.className = "lhb-banner"; b.innerHTML = "<b>Woche "+S.week+"</b>"; var bd = document.getElementById("lhb"); if (bd) { bd.appendChild(b); setTimeout(function(){ b.remove(); }, 1900); }
}
function endWeek(){
 S.exq = Object.keys(S.cs).filter(function(id){ var s = S.cs[id]; return s.mk && !s.end && s.mk.exp <= S.week; });
 nextExpiry();
}
function nextExpiry(){
 if (S.exq.length) { var id = S.exq.shift(); return expire(id); }
 if (S.week >= S.weeks || !active().length) return finish();
 startWeek();
}
function expire(cid){
 var c = CASES[cid], s = S.cs[cid], nd = c.n[s.node], best = null;
 nd.o2.forEach(function(o,i){ if (best === null || o.c < nd.o2[best].c || (o.c === nd.o2[best].c && /abwarten/.test(o.tag) && !/abwarten/.test(nd.o2[best].tag))) best = i; });
 S.missed++;
 log("⏰ Frist verpasst im Fall «"+esc(c.title)+"».");
 apply(cid, best, true);
 S.modal = {type:"fb"}; save(); feedback();
}

/* ================= SZENE ================= */
function openScene(cid){
 var c = CASES[cid], s = S.cs[cid], nd = c.n[s.node], ow = owners(nd), team = ow.length > 1;
 if (!S.ord || S.ord.node !== s.node || S.ord.cid !== cid) S.ord = {cid:cid, node:s.node, o:shuffle(nd.o2.map(function(x,i){ return i; }))};
 S.modal = {type:"scene", cid:cid}; save();
 var any = false;
 var opts = S.ord.o.map(function(i){ var o = nd.o2[i], can = ow.every(function(r){ return S.t[r] >= o.c; }); if (can) any = true;
   return '<button class="lh-opt" data-i="'+i+'"'+(can?'':' disabled')+'><span class="c'+(o.c?'':' z')+'">'+(o.c?"⏱ "+o.c:"0 ⏱")+'</span><span>'+esc(o.t)+(can?'':' <small>(zu wenig Zeit)</small>')+'</span></button>'; }).join("");
 var left = s.mk ? s.mk.exp - S.week + 1 : 1;
 var h = '<div class="lh-hero sm">'+img(team?"lh-besprechung.jpg":c.img, c.title)+'<span class="emo">'+(team?"🤝":c.emo)+'</span><div class="cap"><small>Fall · '+esc(c.title)+' · Woche '+S.week+'</small><b>'+(team?"Fallbesprechung im Lehrerzimmer":esc(c.short))+'</b></div></div><div class="lh-body">'
  + (team ? '<p style="background:#fff6e5;border:1px solid #f0d7a6;border-radius:12px;padding:8px 12px">🤝 <b>Gemeinsam entscheiden:</b> '+ow.map(function(r){ return roleChip(r,true); }).join(" ")+' Besprecht euch. Die Zeit wird bei allen Beteiligten abgezogen.</p>' : '<p>'+rimg(ow[0])+roleChip(ow[0],true)+'</p>')
  + '<p style="font-size:17px">'+esc(nd.t)+'</p>'+meters(cid)+'<div class="lh-opts">'+opts+'</div>'
  + '<p class="lh-row" style="justify-content:space-between;font-size:13px;color:var(--mut);margin-top:10px"><span>Die Reihenfolge ist zufällig. Frist: noch '+left+' Woche(n).</span><button class="lh-btn sm alt" id="lh-later">Später entscheiden</button></p></div>';
 modal(h, function(d){
  d.querySelectorAll(".lh-opt").forEach(function(b){ b.onclick = function(){ apply(cid, +b.dataset.i, false); S.modal = {type:"fb"}; save(); feedback(); }; });
  d.querySelector("#lh-later").onclick = function(){ log(esc(pl(cur()))+" verschiebt den Fall «"+esc(c.title)+"»."); endTurn(); };
 });
}
function apply(cid, i, auto){
 var c = CASES[cid], s = S.cs[cid], nd = c.n[s.node], o = nd.o2[i], ow = owners(nd);
 if (!auto) ow.forEach(function(r){ addT(r, -o.c); });
 var before = {b:s.b, k:s.k, e:s.e, p:s.p};
 ["b","k","e"].forEach(function(v){ if (o.e[v]) s[v] = clamp(s[v]+o.e[v], 0, 10); });
 if (o.e.p) s.p = clamp(s.p+o.e.p, 1, 3);
 if (o.tag && !auto) o.tag.split(" ").forEach(function(t){ ow.forEach(function(r){ var p = S.prof[S.own[r]]; p[t] = (p[t]||0)+1; }); });
 s.hist.push({w:S.week, r:ow, t:(auto?"⏰ Frist verpasst: ":"")+o.t, fb:o.fb});
 s.mk = null;
 var end = null;
 if (o.n.indexOf("end_") === 0) { end = o.n.slice(4); s.end = end; log(c.emo+" Fall «"+esc(c.title)+"» abgeschlossen: "+{good:"gut gelöst",ok:"gelöst",mid:"teilweise",bad:"ungünstig"}[end]+"."); }
 else { s.node = o.n; s.due = S.week + 1; }
 if (!auto) log(esc(ow.map(pl).join(" + "))+" entscheidet im Fall «"+esc(c.title)+"».");
 S.fb = {kind:"s", cid:cid, o:{t:o.t, fb:o.fb, th:o.th, ins:o.ins}, before:before, end:end, auto:auto};
}
function feedback(){
 var f = S.fb, c = CASES[f.cid], s = S.cs[f.cid], d = [];
 [["b","Belastung "+c.kid,false],["k","Klima",true],["e","Vertrauen der Eltern",true]].forEach(function(x){ var diff = s[x[0]] - f.before[x[0]]; if (diff) d.push('<span class="'+((diff>0)===x[2]?"up":"dn")+'">'+x[1]+' '+(diff>0?"▲ +":"▼ ")+diff+'</span>'); });
 if (s.p !== f.before.p) d.push('<span class="'+(s.p>f.before.p?"dn":"up")+'">Stand: '+["","Testphase","Konsolidierung","Manifestation"][s.p]+'</span>');
 var h = '<div class="lh-body"><p style="color:var(--mut);margin:0 0 6px">'+c.emo+' '+esc(c.title)+' · '+(f.auto?'<b style="color:var(--warn)">⏰ Frist verpasst</b>':'euer Entscheid')+'</p>'
  + (f.auto ? '<p>Niemand hat den Fall rechtzeitig erreicht. Ohne euch passiert Folgendes:</p>' : '')
  + '<p style="font-style:italic;font-size:17px">«'+esc(f.o.t)+'»</p>'
  + '<div class="lh-delta">'+(d.length ? d.join("") : '<span>keine sichtbare Veränderung</span>')+'</div>'
  + '<div class="lh-fb'+(f.auto?" no":"")+'">'+esc(f.o.fb)+'</div>' + thBox(f.o.th, f.o.ins)
  + (f.end ? '<div class="lh-fb '+(f.end==="good"||f.end==="ok"?"ok":"no")+'"><b>Der Fall ist abgeschlossen '+endBadge(f.end)+'</b><br>'+esc(c.ends[f.end])+'</div>' : '<p style="color:var(--mut);font-size:14px">Der Fall geht nächste Woche weiter, ein neuer Marker erscheint.</p>')
  + '<p><button class="lh-btn" id="lh-next">Weiter</button></p></div>';
 modal(h, function(dd){ dd.querySelector("#lh-next").onclick = function(){ S.fb = null; if (f.auto) { closeModal(); S.modal = null; save(); nextExpiry(); } else endTurn(); }; });
 if (f.end === "good" || f.end === "ok") confetti();
}

/* ================= KARTEN ================= */
function wissen(r, pre){
 if (S.modal && S.modal.type === "wissen" && S.modal.q != null) var qi = S.modal.q, ord = S.modal.ord;
 else {
  var pool = W.map(function(x,i){ return i; }).filter(function(i){ return S.used.indexOf(i) < 0; });
  if (!pool.length) { S.used = []; pool = W.map(function(x,i){ return i; }); }
  qi = pool[Math.floor(Math.random()*pool.length)]; ord = shuffle([0,1,2,3]);
  S.modal = {type:"wissen", r:r, q:qi, ord:ord, pre:pre||""}; save();
 }
 var q = W[qi];
 var h = '<div class="lh-hero sm">'+img("lh-wissen.jpg","Fachbücher auf einem Pult")+'<span class="emo">📖</span><div class="cap"><small>'+esc(S.modal.pre||"")+'Wissenskarte</small><b>Was sagt die Forschung?</b></div></div><div class="lh-body">'
  + '<p>Antwortet: '+roleChip(r,true)+' · richtig = +1 ⏱. Die anderen dürfen helfen.</p><p style="font-size:18px"><b>'+esc(q[0])+'</b></p><div class="lh-opts">'
  + ord.map(function(k){ return '<button class="lh-opt" data-k="'+k+'"><span>'+esc(q[1][k])+'</span></button>'; }).join("") + '</div></div>';
 modal(h, function(d){ d.querySelectorAll(".lh-opt").forEach(function(b){ b.onclick = function(){
  var ok = +b.dataset.k === q[2]; S.used.push(qi); S.kn.n++; if (ok) { S.kn.r++; addT(r, 1); }
  log(esc(pl(r))+(ok?" beantwortet eine Wissenskarte richtig (+1 ⏱).":" verpasst eine Wissenskarte."));
  info({title: ok ? "Richtig! +1 ⏱" : "Nicht ganz", icon: ok ? "✔" : "✘", ok:ok, text:"Richtig ist: «"+q[1][q[2]]+"». "+q[3], th:q[4]});
  if (ok) confetti();
 }; }); });
}
function event(r){
 var pool = EV.map(function(x,i){ return i; }).filter(function(i){ return S.ev.indexOf(i) < 0; });
 if (!pool.length) { S.ev = []; pool = EV.map(function(x,i){ return i; }); }
 var i = pool[Math.floor(Math.random()*pool.length)], e = EV[i]; S.ev.push(i);
 var res = e.f(r);
 log(esc(pl(r))+": ⚡ "+esc(e.t)+". "+esc(res));
 info({title:e.t, icon:"⚡", img:"lh-karte-alltag.jpg", kick:"Schulalltag", text:e.x, res:res, th:e.th});
}
function info(m){
 m.type = "info"; S.modal = m; save();
 var h = (m.img ? '<div class="lh-hero sm">'+img(m.img,"")+'<span class="emo">'+m.icon+'</span><div class="cap"><small>'+esc(m.kick||"Schulhaus Lindenhof")+'</small><b>'+esc(m.title)+'</b></div></div>' : '')
  + '<div class="lh-body">'+(m.img ? '' : '<h3 style="margin-top:0">'+m.icon+' '+esc(m.title)+'</h3>')
  + '<p'+(m.ok!=null?' class="lh-fb '+(m.ok?"ok":"no")+'"':'')+'>'+esc(m.text)+'</p>'
  + (m.res ? '<div class="lh-delta"><span>'+esc(m.res)+'</span></div>' : '')
  + thBox(m.th) + '<p><button class="lh-btn" id="lh-next">Weiter</button></p></div>';
 modal(h, function(d){ d.querySelector("#lh-next").onclick = endTurn; });
}

/* ================= AUSWERTUNG ================= */
function score(id){ var s = S.cs[id], base = {good:85, ok:68, mid:48, bad:25, open:40}[s.end || "open"]; return clamp(Math.round(base + (4 - s.b)*2 + (s.k - 5) + (s.e - 5)), 0, 100); }
function finish(){
 S.over = true; S.modal = null; save(); closeModal();
 var ids = Object.keys(S.cs), tot = Math.round(ids.reduce(function(a,id){ return a + score(id); }, 0) / ids.length);
 var verdict = tot >= 75 ? "Das Schulhaus Lindenhof ist ein sicherer Ort. Ihr habt früh hingeschaut und zusammengearbeitet." : tot >= 55 ? "Vieles ist gelungen, einiges ist noch offen. Schaut euch die Wendepunkte an." : "Das Quartal war schwierig. Gerade darum lohnt sich die Nachbesprechung.";
 var h = '<div class="lh-panel"><div class="lh-hero">'+img(tot>=55?"lh-ende-gut.jpg":"lh-ende-offen.jpg","Pausenplatz")+'<span class="emo">'+(tot>=55?"🌳":"🌙")+'</span><div class="cap"><small>Ende des Quartals</small><b>Auswertung</b></div></div><div class="lh-body">'
  + '<div class="lh-row" style="gap:18px"><div class="lh-score">'+tot+'</div><div><b>Schulklima (von 100)</b><br>'+verdict+'<br><small style="color:var(--mut)">Wissenskarten: '+S.kn.r+' von '+S.kn.n+' richtig · verpasste Fristen: '+S.missed+'</small></div></div>'
  + '<h3>Eure Fälle</h3>' + ids.map(function(id){ var c = CASES[id], s = S.cs[id], e = s.end || "open";
     return '<div class="lh-cs" style="margin:10px 0"><h4>'+c.emo+' '+esc(c.title)+endBadge(e)+' <small style="color:var(--mut);font-weight:400">'+score(id)+' Punkte</small></h4><p style="margin:4px 0">'+(s.end?esc(c.ends[s.end]):"Der Fall ist am Ende des Quartals noch nicht abgeschlossen. Hätte früheres Handeln geholfen?")+'</p>'+meters(id)
      + '<details><summary><b>Zeitleiste der Entscheide</b></summary><ul class="lh-tl">'+s.hist.map(function(x){ return '<li><small>Woche '+x.w+' · '+x.r.map(function(r){ return RL[r].s; }).join(" + ")+'</small><br><b>'+esc(x.t)+'</b><br><small>'+esc(x.fb)+'</small></li>'; }).join("")+'</ul></details></div>'; }).join("")
  + '<h3>Eure Profile</h3><div class="lh-prof">'+S.names.map(function(nm,i){ var p = S.prof[i], ks = Object.keys(TAGS).filter(function(k){ return p[k]; }).sort(function(a,b){ return p[b]-p[a]; });
     return '<div><b>'+esc(nm)+'</b> · '+ROLES.filter(function(r){ return S.own[r]===i; }).map(function(r){ return RL[r].s; }).join(", ")+'<br>'+(ks.length ? ks.map(function(k){ return TAGS[k]+': '+p[k]; }).join("<br>") : '<small>keine Entscheide</small>')+'</div>'; }).join("")+'</div>'
  + '<h3>Für die Nachbesprechung</h3><ol>'+REFLECT.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join("")+'</ol>'
  + '<h3>Eure Theorie-Kärtchen ('+S.th.length+')</h3>'+S.th.map(function(k){ var t = TH[k]; return '<div class="lh-th" style="margin:8px 0"><span class="ic">📚</span><div><b>'+esc(t.t)+'</b>'+esc(t.x)+' <small>('+esc(t.q)+')</small><br><a href="konflikte.html#'+t.a+'" target="_blank" rel="noopener">Zur Themenseite →</a></div></div>'; }).join("")
  + '<p style="margin-top:14px">🛠 Alle Instrumente zum Thema findest du auf der <a href="konflikte.html#instrumente" style="text-decoration:underline">Themenseite Konflikte, Gewalt und Mobbing</a>.</p>'
  + '<p class="lh-row"><button class="lh-btn" id="lh-again">Neues Spiel</button><button class="lh-btn alt" id="lh-print">Auswertung drucken</button></p></div></div>';
 root.innerHTML = h; window.scrollTo({top: root.getBoundingClientRect().top + window.scrollY - 90, behavior:"smooth"});
 if (tot >= 55) confetti();
 root.querySelector("#lh-again").onclick = function(){ try{localStorage.removeItem(KEY);}catch(e){} setup(); };
 root.querySelector("#lh-print").onclick = function(){ root.querySelectorAll("details").forEach(function(d){ d.open = true; }); window.print(); };
}

setup();
})();
  </script>
