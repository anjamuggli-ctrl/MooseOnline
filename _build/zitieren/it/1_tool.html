  .zt-fields{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}

  .zt-f.h{grid-column:span 3}.zt-f.t{grid-column:span 2}
  @media (max-width:560px){.zt-f.h,.zt-f.t{grid-column:span 6}}
  .zt-f small{font-size:12px;color:#7b8781;line-height:1.35}

  .zt-out{border-left:4px solid var(--acc);background:var(--soft);border-radius:0 10px 10px 0;padding:9px 12px;margin:6px 0;line-height:1.55;position:relative;font-size:15px}

  .zt-list{margin-top:16px}

  .zt details summary{cursor:pointer;font-weight:700}

var PSTYLE = 'font-family:Verdana,sans-serif;font-size:10pt;line-height:150%;margin:0 0 6pt 1.25cm;text-indent:-1.25cm;text-align:left';
function listDoc(full){
 var sx = suffixes(S.list), body = sorted().map(function(s){ return '<p style="'+PSTYLE+'">'+reference(s, sx[s.id])+'</p>'; }).join("");
 return full ? body : body;
}
function copyRich(html){
 var plain = html.replace(/<br>/g,"\n").replace(/<\/p>/g,"\n").replace(/<[^>]+>/g,"").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').trim();
 var styled = '<div style="font-family:Verdana,sans-serif;font-size:10pt">'+html+'</div>';
 if (navigator.clipboard && window.ClipboardItem) {
  navigator.clipboard.write([new ClipboardItem({"text/html": new Blob([styled], {type:"text/html"}), "text/plain": new Blob([plain], {type:"text/plain"})})]).catch(function(){ fallbackCopy(styled); });
 } else fallbackCopy(styled);
}
function fallbackCopy(html){ var d = document.createElement("div"); d.contentEditable = "true"; d.style.position = "fixed"; d.style.left = "-9999px"; d.innerHTML = html; document.body.appendChild(d); var r = document.createRange(); r.selectNodeContents(d); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); try { document.execCommand("copy"); } catch(e){} s.removeAllRanges(); d.remove(); }
function downloadDoc(){
 var html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>Literaturverzeichnis</title></head><body>'
  + '<h1 style="font-family:Verdana,sans-serif;font-size:14pt">Literaturverzeichnis</h1>' + listDoc(true) + '</body></html>';
 var blob = new Blob(["﻿", html], {type:"application/msword"}), a = document.createElement("a");
 a.href = URL.createObjectURL(blob); a.download = "Literaturverzeichnis.doc"; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

draw();
})();
