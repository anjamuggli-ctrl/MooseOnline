  <style>
  .pt{--pt-ink:#2f3a32;--pt-mut:#6b7368;--pt-bg:#fbfaf6;--pt-line:#d9d3c4;--solar:#d9a21b;--wind:#4f8fbf;--hydro:#2a6f97;--nuclear:#7d4f96;--gas:#7a7a7a;--event:#b0573a;--quiz:#3f5d4a;--stats:#3b4f8a;color:var(--pt-ink)}
  .pt *{box-sizing:border-box}
  .pt-setup{background:#fff;border:1px solid var(--pt-line);border-radius:18px;padding:22px;max-width:860px;margin:0 auto}
  .pt-setup h2{margin:0 0 6px}
  .pt-setup .row{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
  .pt-pl{display:flex;align-items:center;gap:10px;background:var(--pt-bg);border:1px solid var(--pt-line);border-radius:12px;padding:8px 12px;flex:1 1 360px}
  .pt-pl input[type=text]{flex:1;border:1px solid var(--pt-line);border-radius:8px;padding:7px 9px;font:inherit}
  .pt-pl label{display:flex;align-items:center;gap:6px;font-size:14px;white-space:nowrap}
  .pt-chipset{display:flex;flex-wrap:wrap;gap:8px}
  .pt-chipset button{border:1.5px solid var(--pt-line);background:#fff;border-radius:999px;padding:7px 14px;font:inherit;cursor:pointer}
  .pt-chipset button.on{background:var(--pt-ink);color:#fff;border-color:var(--pt-ink)}
  .pt-btn{border:0;background:var(--pt-ink);color:#fff;border-radius:999px;padding:11px 22px;font:inherit;font-weight:700;cursor:pointer}
  .pt-btn.alt{background:#fff;color:var(--pt-ink);border:1.5px solid var(--pt-ink)}
  .pt-btn:disabled{opacity:.45;cursor:default}
  .pt-rules{font-size:15px;line-height:1.55;color:#3d4b41}
  .pt-rules li{margin:4px 0}
  .pt-game{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px;align-items:start}
  @media(max-width:980px){.pt-game{grid-template-columns:1fr}}
  .pt-board{position:relative;background-size:cover;background-position:center;display:grid;grid-template-columns:1.25fr repeat(5,1fr) 1.25fr;grid-template-rows:1.25fr repeat(5,1fr) 1.25fr;gap:3px;aspect-ratio:1/1;width:100%;max-width:760px;margin:0 auto;background-color:#e9e4d6;border:3px solid var(--pt-ink);border-radius:16px;padding:3px}
  .pt-f{position:relative;background:rgba(255,255,255,.88);backdrop-filter:blur(2px);border-radius:7px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3px 2px 2px;cursor:pointer;min-width:0;min-height:0}
  .pt-f:hover{outline:2px solid var(--pt-ink)}
  .pt-f .band{position:absolute;left:0;right:0;top:0;height:6px;background:var(--c)}
  .pt-f .ic{font-size:clamp(13px,2.4vw,22px);line-height:1;margin-top:4px}
  .pt-f .nm{font-size:clamp(7px,1.05vw,11px);line-height:1.15;color:var(--pt-ink);font-weight:600;margin-top:2px;overflow:hidden;max-height:2.4em}
  .pt-f .pr{font-size:clamp(7px,.95vw,10px);color:var(--pt-mut)}
  .pt-f.corner{background:rgba(246,235,220,.92)}.pt-f.corner .nm{font-size:clamp(8px,1.2vw,12.5px)}
  .pt-f .own{position:absolute;inset:0;border:4px solid var(--oc);border-radius:7px;pointer-events:none}
  .pt-f .lvl{position:absolute;right:3px;bottom:2px;font-size:10px;color:var(--oc);font-weight:800}
  .pt-f .toks{position:absolute;left:2px;bottom:2px;display:flex;flex-wrap:wrap;gap:1px;max-width:100%}
  .pt-tok{width:clamp(16px,3vw,30px);height:clamp(16px,3vw,30px);border-radius:50%;background:var(--tc) center/cover no-repeat;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;font-size:clamp(9px,1.4vw,15px)}
  .pt-tok.img{background-color:transparent;border:0;box-shadow:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
  .pt-tok.active{animation:pt-hop .9s ease-in-out infinite}
  @keyframes pt-hop{50%{transform:translateY(-4px)}}
  .pt-center{grid-column:2/7;grid-row:2/7;position:relative;border-radius:10px;overflow:hidden;background:linear-gradient(160deg,#cfe3c4,#a9cbe0 55%,#e9cf96);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4%}

  .pt-turnbox{text-align:center}
  .pt-turnbox .yr{font-size:34px;font-weight:800;font-family:Georgia,serif;line-height:1.05}
  .pt-turnbox .rd{font-size:12.5px;color:var(--pt-mut)}
  .pt-turnbox .pt-btn{width:100%}
  .pt-meter{margin:8px 0 4px;height:14px;border-radius:999px;background:#e8ece8;overflow:hidden;border:1px solid #cdd6ce}

  .pt-mlbl{display:flex;justify-content:space-between;font-size:11px;color:var(--pt-mut)}

  .pt-die i{width:11px;height:11px;border-radius:50%;background:var(--pt-ink);margin:auto;visibility:hidden}

  @media(max-width:640px){.pt-f .pr{display:none}}
  @media(max-width:980px){.pt-turnbox{order:-1}.pt-log{max-height:140px}}
  .pt-side{display:flex;flex-direction:column;gap:12px}
  .pt-card{background:#fff;border:1px solid var(--pt-line);border-radius:14px;padding:12px 14px}
  .pt-card h3{margin:0 0 8px;font-size:16px}
  .pt-p{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;border:2px solid transparent}
  .pt-p.now{border-color:var(--tc);background:var(--pt-bg)}
  .pt-p .who{flex:1;min-width:0}
  .pt-p .pt-tok{width:40px;height:40px;font-size:18px}
  .pt-p b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pt-p small{color:var(--pt-mut);font-size:12.5px}
  .pt-p .cr{font-weight:800;font-variant-numeric:tabular-nums}
  .pt-turn{text-align:center}
  .pt-turn .msg{font-size:15px;min-height:2.6em;margin:4px 0 8px}
  .pt-log{max-height:170px;overflow:auto;font-size:13px;color:#45524a;padding-left:16px;margin:0}
  .pt-log li{margin:3px 0}
  .pt-modal{position:fixed;inset:0;background:rgba(30,38,32,.55);display:flex;align-items:center;justify-content:center;z-index:100000;padding:14px}
  .pt-modal[hidden]{display:none}
  .pt-mbox{background:#fff;border-radius:18px;max-width:560px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 18px 60px rgba(0,0,0,.35);animation:pt-pop .25s ease-out}
  @keyframes pt-pop{from{transform:scale(.92);opacity:0}}
  .pt-mimg{position:relative;aspect-ratio:3/2;background:linear-gradient(135deg,var(--c,#3f5d4a),#2f3a32);display:flex;align-items:center;justify-content:center;font-size:64px;color:rgba(255,255,255,.9)}
  .pt-mimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .pt-mimg .tag{position:absolute;left:14px;top:14px;background:rgba(255,255,255,.92);color:var(--pt-ink);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
  .pt-mbody{padding:16px 20px 20px}
  .pt-mbody h3{margin:0 0 6px;font-size:20px}
  .pt-mbody p{margin:6px 0;line-height:1.5}
  .pt-opts{display:grid;gap:8px;margin:12px 0}
  .pt-opts button{text-align:left;border:1.5px solid var(--pt-line);background:var(--pt-bg);border-radius:12px;padding:10px 12px;font:inherit;cursor:pointer}
  .pt-opts button:hover:not(:disabled){border-color:var(--pt-ink)}
  .pt-opts button.ok{background:#e3f1df;border-color:#4f8a52}
  .pt-opts button.no{background:#f6e0dc;border-color:#b04a4a}
  .pt-expl{background:var(--pt-bg);border-left:4px solid var(--c,#3f5d4a);border-radius:8px;padding:9px 12px;font-size:14.5px;margin:8px 0}
  .pt-acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:12px}
  .pt-facts{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:14px;margin:8px 0;padding:10px;background:var(--pt-bg);border-radius:10px}
  .pt-rank{width:100%;border-collapse:collapse;margin:10px 0;font-size:14.5px}
  .pt-rank td,.pt-rank th{padding:6px 8px;border-bottom:1px solid var(--pt-line);text-align:left}
  .pt-rank td.n{text-align:right;font-variant-numeric:tabular-nums}
  .pt-mini{display:flex;align-items:flex-end;gap:6px;height:110px;margin:10px 0 2px;padding:0 4px;border-bottom:1.5px solid var(--pt-ink)}
  .pt-mini div{flex:1;background:var(--stats);border-radius:4px 4px 0 0;position:relative}
  .pt-mini div span{position:absolute;top:-17px;left:0;right:0;text-align:center;font-size:11px;font-weight:700}
  .pt-minil{display:flex;gap:6px;padding:0 4px;font-size:11px;color:var(--pt-mut)}.pt-minil span{flex:1;text-align:center}
  </style>

function pickQ(cat, level){
 var pool = Q[cat].filter(function(q){ return !level || q[4] === level; });
 if (!pool.length) pool = Q[cat];
 used[cat] = used[cat] || [];
 var fresh = pool.filter(function(q){ return used[cat].indexOf(Q[cat].indexOf(q)) < 0; });
 if (!fresh.length) { used[cat] = []; fresh = pool; }
 var q = fresh[rnd(fresh.length)]; used[cat].push(Q[cat].indexOf(q)); return q;
}

function fresh(players, rounds){
 return {players:players.map(function(p,i){ return {id:i, nm:p.nm, tok:p.tok, cr:500, pos:0, skip:false, right:0, asked:0}; }),
  own:{}, lvl:{}, turn:0, round:1, rounds:rounds, meter:3, log:[], phase:"roll", over:false, deck:shuffle(EVENTS.map(function(e,i){return i;}))};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ return null; } }
function cur(){ return S.players[S.turn]; }
function count(p,t){ var n=0; for (var i in S.own) if (S.own[i]===p.id && FIELDS[i].t===t) n++; return n; }
function add(p,n){ p.cr += n; }
function pay(p,n,to){ p.cr -= n; if (to) to.cr += n; }
function meter(d){ S.meter = Math.max(0, Math.min(10, S.meter + d)); }
function log(s){ S.log.unshift(s); S.log = S.log.slice(0,40); }
function year(){ return Math.min(2050, 2026 + Math.round((S.round-1) * 24 / S.rounds)); }
function yieldOf(i){ var f=FIELDS[i]; return PT[f.t].yield * (S.lvl[i]||1); }

function upgradeTokens(){
 [].forEach.call(root.querySelectorAll(".pt-tok[data-tok]"), function(el){
  var t = TOKENS[+el.dataset.tok], probe = new Image();
  probe.onload = function(){ el.classList.add("img"); el.style.backgroundImage = "url("+IMG+t.img+")"; el.textContent = ""; };
  probe.src = IMG + t.img;
 });
}
function game(){
 root.innerHTML = '<div class="pt-game"><div><div class="pt-board" id="pt-board"></div></div><div class="pt-side" id="pt-side"></div></div>'
  +'<div class="pt-modal" id="pt-modal" hidden><div class="pt-mbox" role="dialog" aria-modal="true" id="pt-mbox"></div></div>';
 draw();
 if (S.over) end();
}
function draw(){
 var b = '';
 FIELDS.forEach(function(f,i){
  var c = cell(i), corner = (i % 6 === 0);
  var col = f.k==="plant" ? PT[f.t].c : FCOL[f.k];
  var ic = f.k==="plant" ? PT[f.t].ic : f.ic;
  var own = S.own[i], ownP = own != null ? S.players[own] : null;
  var here = S.players.filter(function(p){ return p.pos === i; });
  b += '<div class="pt-f'+(corner?' corner':'')+'" style="grid-row:'+c[0]+';grid-column:'+c[1]+';--c:'+col+(ownP?';--oc:'+TOKENS[ownP.tok].c:'')+'" data-f="'+i+'" title="'+esc(f.nm)+'">'
   +'<span class="band"></span><span class="ic">'+ic+'</span><span class="nm">'+esc(f.nm)+'</span>'
   +(f.k==="plant" && own==null ? '<span class="pr">'+PT[f.t].price+'</span>' : '')
   +(ownP ? '<span class="own"></span><span class="lvl">'+(S.lvl[i]===2?'★★':'★')+'</span>' : '')
   +'<span class="toks">'+here.map(function(p){ return tokHtml(p, p===cur() && !S.over); }).join("")+'</span></div>';
 });
 var p = cur();
 b += '<div class="pt-center" role="img" aria-label="Vogelperspektive auf eine Schweizer Seestadt im Wandel zu sauberer Energie"></div>';
 var board = document.getElementById("pt-board"); board.innerHTML = b;
 if (BOARD_OK) { board.classList.add("hasimg"); board.style.backgroundImage = "url("+IMG+"pt-board.jpg)"; }
 board.onclick = function(e){ var f = e.target.closest(".pt-f"); if (f && S.phase==="roll") info(+f.dataset.f); };

 var s = '<div class="pt-card"><h3>Städte</h3>';
 S.players.forEach(function(q){
  var plants = Object.keys(S.own).filter(function(i){ return S.own[i]===q.id; }).map(function(i){ return PT[FIELDS[i].t].ic; }).join(" ");
  s += '<div class="pt-p'+(q===p&&!S.over?' now':'')+'" style="--tc:'+TOKENS[q.tok].c+'">'+tokHtml(q,false)+'<div class="who"><b>'+esc(q.nm)+'</b><small>'+(plants||"noch keine Kraftwerke")+(q.skip?' · ⏸ setzt einmal aus':'')+'</small></div><span class="cr">'+q.cr+'</span></div>';
 });
 s += '</div><div class="pt-card"><h3>Tagebuch</h3><ul class="pt-log">'+S.log.map(function(l){ return '<li>'+l+'</li>'; }).join("")+'</ul></div>'
  +'<div class="pt-card pt-turnbox"><div class="rd">Runde '+Math.min(S.round,S.rounds)+' von '+S.rounds+'</div><div class="yr">'+year()+'</div>'
  +'<div class="pt-meter" title="Klimabarometer: '+S.meter+' von 10"><span style="width:'+(S.meter*10)+'%"></span></div><div class="pt-mlbl"><span>Klimabarometer</span><span><b>'+S.meter+'</b> / 10</span></div>'
  +'<div class="pt-die" id="pt-die" aria-hidden="true">'+dieFace(S.lastRoll||1)+'</div>'
  +'<button class="pt-btn" id="pt-roll"'+(S.phase!=="roll"||S.over?' disabled':'')+'>'+esc(p.nm)+': würfeln</button></div>'
  +'<div class="pt-newrow" style="display:flex;gap:8px;flex-wrap:wrap"><button class="pt-btn alt" id="pt-rulesbtn" style="padding:8px 14px;font-size:14px">📖 Regeln</button><button class="pt-btn alt" id="pt-new" style="padding:8px 14px;font-size:14px">Neues Spiel</button></div>';
 var side = document.getElementById("pt-side"); side.innerHTML = s;
 document.getElementById("pt-roll").addEventListener("click", roll);
 document.getElementById("pt-rulesbtn").addEventListener("click", function(){ open({title:"So wird Power Town gespielt", ic:"📖", c:"#3f5d4a", img:"pt-tile.jpg", html:RULES, acts:[{t:"Schliessen", f:close}]}); });
 document.getElementById("pt-new").addEventListener("click", function(){ if (confirm("Neues Spiel starten? Das laufende Spiel geht verloren.")) { try{localStorage.removeItem(KEY);}catch(e){} setup(); } });
 upgradeTokens();
}
var PIPS = {1:[5],2:[1,9],3:[1,5,9],4:[1,3,7,9],5:[1,3,5,7,9],6:[1,3,4,6,7,9]};
function dieFace(n){ var h=''; for (var k=1;k<=9;k++) h += '<i style="'+(PIPS[n].indexOf(k)>=0?'visibility:visible':'')+'"></i>'; return h; }

/* ================= MODAL ================= */
var modal, mbox;
function open(o){
 modal = document.getElementById("pt-modal"); mbox = document.getElementById("pt-mbox");
 var h = '<div class="pt-mimg" style="--c:'+(o.c||"#3f5d4a")+'">'+(o.ic||"")+(o.img?img(o.img,o.alt||o.title):"")+(o.tag?'<span class="tag">'+esc(o.tag)+'</span>':'')+'</div><div class="pt-mbody"><h3>'+esc(o.title)+'</h3>'+(o.html||"")+'<div id="pt-mq"></div><div class="pt-acts" id="pt-acts"></div></div>';
 mbox.innerHTML = h; modal.hidden = false;
 setActs(o.acts||[]);
 var f = mbox.querySelector("button"); if (f) f.focus();
}
function setActs(acts){
 var a = document.getElementById("pt-acts"); a.innerHTML = "";
 acts.forEach(function(x){ var b = document.createElement("button"); b.className = "pt-btn"+(x.alt?" alt":""); b.textContent = x.t; b.disabled = !!x.dis; b.onclick = x.f; a.appendChild(b); });
}
function close(){ modal.hidden = true; }

/* ask a question inside the open modal; cb(correct) */
function ask(cat, level, cb){
 var q = pickQ(cat, level), p = cur();
 var box = document.getElementById("pt-mq");
 var order = shuffle(q[1].map(function(o,i){ return i; }));
 var chart = q[5] ? miniChart(q[5]) : "";
 box.innerHTML = '<div class="pt-expl" style="margin-top:12px"><b>'+CATS[cat]+(q[4]===2?' · schwierigere Frage':'')+'</b></div>'+chart+'<p><b>'+esc(q[0])+'</b></p><div class="pt-opts">'
  + order.map(function(i){ return '<button data-i="'+i+'">'+esc(q[1][i])+'</button>'; }).join("")+'</div><div id="pt-qx"></div>';
 setActs([]);
 box.querySelector(".pt-opts").addEventListener("click", function(e){
  var b = e.target.closest("button"); if (!b || b.disabled) return;
  var ok = +b.dataset.i === q[2];
  [].forEach.call(this.children, function(x){ x.disabled = true; if (+x.dataset.i === q[2]) x.classList.add("ok"); });
  if (!ok) b.classList.add("no");
  p.asked++; if (ok) p.right++;
  document.getElementById("pt-qx").innerHTML = '<div class="pt-expl"><b>'+(ok?"Richtig!":"Nicht ganz.")+'</b> '+esc(q[3])+'</div>';
  cb(ok);
 });
}
function miniChart(d){
 var mx = Math.max.apply(null, d.v), mn = d.min||0;
 return '<div class="pt-mini">'+d.v.map(function(v){ return '<div style="height:'+Math.max(6,(v-mn)/(mx-mn)*100)+'%"><span>'+v+'</span></div>'; }).join("")+'</div><div class="pt-minil">'+d.l.map(function(l){ return '<span>'+esc(l)+'</span>'; }).join("")+'</div><p style="font-size:12px;color:var(--pt-mut);margin:2px 0 0">Einheit:'+esc(d.u)+(mn?' · die Achse beginnt bei '+mn:'')+'</p>';
}

/* ================= TURN ================= */
function roll(){
 if (S.phase !== "roll") return;
 var p = cur();
 S.phase = "move";
 /* income */
 var inc = 0; for (var i in S.own) if (S.own[i] === p.id) inc += yieldOf(i);
 if (inc) { add(p, inc); }
 var die = document.getElementById("pt-die"), btn = document.getElementById("pt-roll");
 btn.disabled = true; die.classList.add("roll");
 var n = 1 + rnd(6), k = 0;
 var spin = setInterval(function(){ die.innerHTML = dieFace(1+rnd(6)); if (++k > 7) { clearInterval(spin); die.classList.remove("roll"); die.innerHTML = dieFace(n); S.lastRoll = n; step(p, n, inc); } }, 70);
}
function step(p, n, inc){
 var steps = 0;
 log(esc(p.nm)+" würfelt eine "+n+(inc?" und verdient "+inc+" Taler mit den Kraftwerken":"")+".");
 var t = setInterval(function(){
  p.pos = (p.pos + 1) % 24; steps++;
  if (p.pos === 0) passStart(p);
  draw();
  if (steps >= n) { clearInterval(t); setTimeout(function(){ land(p); }, 280); }
 }, 230);
}
function passStart(p){
 add(p, 100);
 var g = count(p, "gas");
 if (g) { meter(g); log(esc(p.nm)+" zieht am Rathaus vorbei: +100 Taler. Die Gaskraftwerke erhöhen das Klimabarometer um "+g+"."); }
 else log(esc(p.nm)+" zieht am Rathaus vorbei: +100 Taler.");
}
function land(p){
 var i = p.pos, f = FIELDS[i];
 if (S.meter >= 10) return finish(true);
 if (f.k === "plant") return plantField(p, i);
 if (f.k === "start") { open({title:"Rathaus", ic:"🏛️", c:"#a8682f", img:"pt-field-townhall.jpg", html:"<p>Du bist im Rathaus. Zeit, die nächsten Investitionen zu planen.</p>", acts:[{t:"OK", f:next}]}); return; }
 if (f.k === "event") return eventField(p);
 if (f.k === "quiz") {
  var c = anyCat();
  open({title:"Quiz", tag:"Quiz", ic:"❓", c:"var(--quiz)", img:"pt-card-question.jpg", html:"<p>Antworte richtig und verdiene <b>50 Taler</b>.</p>"});
  ask(c, 0, function(ok){ if (ok) add(p,50); log(esc(p.nm)+(ok?" beantwortet die Quizfrage richtig: +50.":" verpasst die Quizfrage.")); setActs([{t:"Weiter", f:next}]); });
  return;
 }
 if (f.k === "stats") {
  open({title:"Statistik", tag:"Statistik", ic:"📊", c:"var(--stats)", img:"pt-card-stats.jpg", html:"<p>Lies die Zahlen genau. Richtig: <b>+70 Taler</b>.</p>"});
  ask("stats", 0, function(ok){ if (ok) add(p,70); log(esc(p.nm)+(ok?" liest die Statistik richtig: +70.":" liest die Statistik falsch.")); setActs([{t:"Weiter", f:next}]); });
  return;
 }
 if (f.k === "summit") {
  open({title:"Klimagipfel", tag:"Klimagipfel", ic:"🌍", c:"#4f8a52", img:"pt-field-summit.jpg", html:"<p>Die Städte treffen sich, um über Klimaschutz zu sprechen. Antwortest du richtig, <b>sinkt das Klimabarometer um 1</b>.</p>"});
  ask(["gh","sea"][rnd(2)], 0, function(ok){ if (ok) meter(-1); log(esc(p.nm)+(ok?" überzeugt am Klimagipfel: Klimabarometer −1.":" kann den Klimagipfel nicht überzeugen.")); setActs([{t:"Weiter", f:next}]); });
  return;
 }
 if (f.k === "fair") {
  open({title:"Energiemesse", tag:"Energiemesse", ic:"🎪", c:"#c98a12", img:"pt-field-fair.jpg", html:"<p>Stelle den Energieplan deiner Stadt an der Messe vor. Eine schwierigere Frage: richtig gibt <b>+150 Taler</b>.</p>"});
  ask(anyCat(), 2, function(ok){ if (ok) add(p,150); log(esc(p.nm)+(ok?" gewinnt den Preis der Energiemesse: +150.":" geht ohne Preis von der Energiemesse nach Hause.")); setActs([{t:"Weiter", f:next}]); });
  return;
 }
 if (f.k === "blackout") {
  open({title:"Stromausfall!", tag:"Stromausfall", ic:"🔌", c:"#2f3a32", img:"pt-event-blackout.jpg", html:"<p>Das Licht geht aus. Antworte richtig, um das Netz zu reparieren. Sonst <b>setzt du einmal aus</b>.</p>"});
  ask(["solar","wind","water","nuclear"][rnd(4)], 0, function(ok){ if (!ok) p.skip = true; log(esc(p.nm)+(ok?" behebt den Stromausfall.":" muss auf das Reparaturteam warten und setzt einmal aus.")); setActs([{t:"Weiter", f:next}]); });
  return;
 }
}
function plantField(p, i){
 var f = FIELDS[i], t = PT[f.t], own = S.own[i];
 var facts = '<div class="pt-facts"><span>Preis: <b>'+t.price+'</b></span><span>Ertrag pro Zug: <b>'+t.yield+'</b> (★★ '+(t.yield*2)+')</span><span>Sauberkeitsbonus am Schluss: <b>'+(t.clean>0?'+':'')+t.clean+'</b></span><span>'+(f.t==="gas"?'⚠️ Klimabarometer +1 bei jedem Durchgang am Rathaus':'kein CO₂ im Betrieb')+'</span></div>';
 var o = {title:f.nm, tag:t.tag, ic:t.ic, c:t.c, img:t.img};
 if (own == null) {
  o.html = facts + (p.cr < t.price ? '<p>Du hast nicht genug Taler, um dieses Kraftwerk zu kaufen.</p>' : '<p>Beantworte die Frage, um das Kraftwerk kaufen zu dürfen.</p>');
  if (p.cr < t.price) { o.acts = [{t:"Weiter", f:next}]; open(o); return; }
  o.acts = []; open(o);
  ask(t.cat, 1, function(ok){
   if (ok) setActs([{t:"Jetzt nicht", alt:true, f:function(){ log(esc(p.nm)+" kauft "+esc(f.nm)+" nicht."); next(); }}, {t:"Kaufen für "+t.price, f:function(){ pay(p,t.price); S.own[i]=p.id; S.lvl[i]=1; log(esc(p.nm)+" kauft "+esc(f.nm)+" "+t.ic+"."); next(); }}]);
   else { log(esc(p.nm)+" kann "+esc(f.nm)+" diesmal nicht kaufen."); setActs([{t:"Weiter", f:next}]); }
  });
  return;
 }
 if (own === p.id) {
  var cost = Math.round(t.price*0.6);
  if (S.lvl[i] === 2) { o.html = facts+"<p>Das ist dein Kraftwerk, und es ist bereits vollständig ausgebaut ★★.</p>"; o.acts=[{t:"Weiter", f:next}]; open(o); return; }
  o.html = facts+"<p>Das ist dein Kraftwerk. Beantworte eine <b>schwierigere Frage</b>, um es für <b>"+cost+"</b> Taler auszubauen. Danach verdient es doppelt.</p>";
  if (p.cr < cost) { o.html += "<p>Du hast nicht genug Taler für den Ausbau.</p>"; o.acts=[{t:"Weiter", f:next}]; open(o); return; }
  open(o);
  ask(t.cat, 2, function(ok){
   if (ok) setActs([{t:"Jetzt nicht", alt:true, f:next}, {t:"Ausbauen für "+cost, f:function(){ pay(p,cost); S.lvl[i]=2; log(esc(p.nm)+" baut "+esc(f.nm)+" aus ★★."); next(); }}]);
   else setActs([{t:"Weiter", f:next}]);
  });
  return;
 }
 var owner = S.players[own], fee = yieldOf(i)*3;
 o.html = facts+"<p>Dieses Kraftwerk gehört <b>"+esc(owner.nm)+"</b>. Du musst eine Netzgebühr von <b>"+fee+"</b> Talern bezahlen. Antwortest du richtig, zahlst du nur die Hälfte.</p>";
 open(o);
 ask(t.cat, 0, function(ok){
  var x = ok ? Math.round(fee/2) : fee;
  pay(p, x, owner); log(esc(p.nm)+" bezahlt "+esc(owner.nm)+" eine Netzgebühr von "+x+" Talern.");
  setActs([{t:"Weiter", f:next}]);
 });
}
function eventField(p){
 if (!S.deck.length) S.deck = shuffle(EVENTS.map(function(e,i){return i;}));
 var e = EVENTS[S.deck.pop()];
 var o = {title:e.t, tag:"Ereignis", ic:"⚡", c:"var(--event)", img:e.img, html:"<p>"+e.x+"</p>"};
 if (e.run) {
  var r = e.run(p); o.html += '<div class="pt-expl"><b>'+r+'</b></div>'; o.acts = [{t:"Weiter", f:next}];
  log(esc(p.nm)+" · Ereignis «"+e.t+"»: "+r); open(o); return;
 }
 open(o);
 var cat = e.q === "any2" ? anyCat() : e.q;
 ask(cat, e.q === "any2" ? 2 : 0, function(ok){
  var r = ok ? e.ok(p) : e.no(p);
  document.getElementById("pt-qx").insertAdjacentHTML("beforeend", '<div class="pt-expl"><b>'+r+'</b></div>');
  log(esc(p.nm)+" · Ereignis «"+e.t+"»: "+r);
  setActs([{t:"Weiter", f:next}]);
 });
}
function next(){
 if (modal) close();
 if (S.meter >= 10) return finish(true);
 var n = S.players.length;
 do {
  S.turn = (S.turn + 1) % n;
  if (S.turn === 0) { S.round++; if (S.round > S.rounds) { draw(); return finish(false); } log("<b>Neue Runde: "+year()+"</b>"); }
  if (cur().skip) { cur().skip = false; log(esc(cur().nm)+" setzt diese Runde aus (Stromausfall)."); continue; }
  break;
 } while (true);
 S.phase = "roll"; save(); draw();
 if (n > 1) { var b = document.getElementById("pt-roll"); if (b) b.focus(); }
}
function info(i){
 var f = FIELDS[i];
 if (f.k !== "plant") { var txt = {start:"Wer am Rathaus vorbeizieht, erhält 100 Taler. Hier erhöhen Gaskraftwerke das Klimabarometer.", event:"Ziehe eine Ereigniskarte.", quiz:"Beantworte eine Frage: +50 Taler.", stats:"Lies eine Grafik oder Zahlen: +70 Taler.", summit:"Richtig antworten: Klimabarometer −1.", fair:"Eine schwierigere Frage: +150 Taler.", blackout:"Richtig antworten, sonst setzt du einmal aus."}[f.k];
  open({title:f.nm, ic:f.ic, c:FCOL[f.k], img:FIMG[f.k], html:"<p>"+txt+"</p>", acts:[{t:"Schliessen", f:close}]}); return; }
 var t = PT[f.t], own = S.own[i];
 open({title:f.nm, tag:t.tag, ic:t.ic, c:t.c, img:t.img, html:'<div class="pt-facts"><span>Preis: <b>'+t.price+'</b></span><span>Ertrag: <b>'+t.yield+'</b> pro Zug (★★ '+(t.yield*2)+')</span><span>Sauberkeitsbonus: <b>'+t.clean+'</b></span><span>Besitz: <b>'+(own!=null?esc(S.players[own].nm):"niemand")+'</b></span></div>', acts:[{t:"Schliessen", f:close}]});
}

/* ================= END ================= */
function score(p){
 var v = 0, c = 0;
 for (var i in S.own) if (S.own[i] === p.id) { var t = PT[FIELDS[i].t]; v += t.price*(S.lvl[i]===2?1.6:1); c += t.clean; }
 return {cr:p.cr, val:Math.round(v/2), clean:c, total:p.cr+Math.round(v/2)+c};
}
function finish(flood){ S.over = true; S.flood = flood; S.phase = "over"; save(); draw(); end(); }
function end(){
 var rows = S.players.map(function(p){ var s = score(p); s.p = p; return s; }).sort(function(a,b){ return b.total - a.total; });
 var h = '';
 if (S.flood) h += '<p>Das Klimabarometer hat 10 erreicht. Der See überflutet die Promenade, und die Städte müssen ihr ganzes Geld für den Schutz ausgeben. <b>Alle verlieren.</b> Nächstes Mal: weniger Gaskraftwerke, mehr saubere Energie und mehr Klimagipfel!</p>';
 else h += '<p>Wir schreiben das Jahr <b>2050</b>. '+(S.meter<=3?'Das Klimabarometer ist tief: Eure Städte haben gemeinsam grossartige Arbeit geleistet!':S.meter<=6?'Das Klimabarometer liegt in der Mitte: gut, aber es gibt noch zu tun.':'Das Klimabarometer ist hoch: Die Städte haben es geschafft, aber nur knapp.')+'</p>';
 h += '<table class="pt-rank"><tr><th>Stadt</th><th class="n">Taler</th><th class="n">Kraftwerke</th><th class="n">Sauber</th><th class="n">Total</th><th class="n">Antworten</th></tr>'
  + rows.map(function(r,k){ return '<tr><td>'+(k===0&&!S.flood?'🏆 ':'')+esc(r.p.nm)+'</td><td class="n">'+r.cr+'</td><td class="n">'+r.val+'</td><td class="n">'+(r.clean>0?'+':'')+r.clean+'</td><td class="n"><b>'+(S.flood?'–':r.total)+'</b></td><td class="n">'+r.p.right+'/'+r.p.asked+'</td></tr>'; }).join("")+'</table>';
 open({title:S.flood?"Das Wasser hat gewonnen":"Netto-null 2050: "+esc(rows[0].p.nm)+" gewinnt!", ic:S.flood?"🌊":"🏆", c:S.flood?"#2a6f97":"#4f8a52", img:S.flood?"pt-lose.jpg":"pt-win.jpg", html:h,
  acts:[{t:"Spielbrett ansehen", alt:true, f:close}, {t:"Neues Spiel", f:function(){ try{localStorage.removeItem(KEY);}catch(e){} close(); setup(); }}]});
}

document.addEventListener("keydown", function(e){ if (e.key === "Escape" && modal && !modal.hidden && mbox.querySelector("#pt-acts button") && /Schliessen/.test(mbox.querySelector("#pt-acts").textContent)) close(); });
setup();
})();
</script>
