  .ie-sw{display:grid;gap:8px;margin:12px 0}

  .ie-meter{display:flex;gap:5px}.ie-meter i{width:18px;height:18px;border-radius:50%;background:#3b4a55;border:2px solid #56656f}.ie-meter i.on{background:#ffd55a;border-color:#fff2b8}
  .ie-hint{background:#fff8e6;border-left:4px solid #e0a526;border-radius:8px;padding:9px 12px;margin:10px 0;font-size:15px}
  .ie-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}

  .ie-best td,.ie-best th{padding:6px 8px;border-bottom:1px solid var(--ie-line);text-align:left}
  .ie-done{background:#e3f1df;border-radius:12px;padding:12px 16px;margin:12px 0;font-weight:600}
  .ie-ov{position:fixed;inset:0;background:rgba(15,26,32,.6);display:flex;align-items:center;justify-content:center;z-index:100000;padding:14px}
  .ie-ovbox{background:#fff;border-radius:18px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:20px 22px;color:#1f2b33;line-height:1.5}
  .ie-ovbox li{margin:4px 0}
  </style>

  <div class="ie" id="ie"><noscript><p>Please turn on JavaScript to play the game.</p></noscript></div>

<script>
(function(){
"use strict";
var root = document.getElementById("ie");
var IMG = (window.SITE_BASE || (/\/(en|it|rm)\/[^\/]*$/.test(location.pathname) ? "../" : "")) + "img/pome24b/games/";
var KEY = "mo_islandescape_v1", BEST = "mo_islandescape_best_v1";
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function shuffle(a){ a = a.slice(); for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
var FALLBACK = {"ie-timeup.jpg":"ie-intro.jpg"};
function img(f, alt){ var fb = FALLBACK[f]; return '<img src="'+IMG+f+'" alt="'+esc(alt)+'"'+(fb?' data-fb="'+IMG+fb+'"':'')+' onerror="if(this.dataset.fb){this.src=this.dataset.fb;this.removeAttribute(\'data-fb\')}else this.remove()">'; }
function mmss(s){ s = Math.max(0, Math.round(s)); return Math.floor(s/60)+":"+("0"+(s%60)).slice(-2); }

var FACTS = '<div class="ie-fact"><b>Fact sheet: Mira Island</b><ul><li>4,000 inhabitants; in summer, about 4,000 tourists come as well.</li><li>About 2,500 hours of sunshine per year, mostly in summer.</li><li>Strong winds on the west coast, especially in autumn and winter.</li><li>The difference between high and low tide is only about 1 metre. One small river, no mountains.</li><li>A bird reserve on the hills of the west coast.</li></ul></div>';
var RULES = '<b>Rules:</b> Every wrong code costs <b>1 minute</b>. Each room has one hint, which costs <b>2 minutes</b>. Talk in English in your team!';
var HOWTO = '<h3 style="margin-top:0">How to play</h3><ul><li>You go through <b>four rooms</b>. In each room, solve the puzzle to find the code, then enter it in the lock.</li><li>Room 1: put the cards in the right order with ▲ and ▼. Room 4: switch ON the true statements and pull the lever.</li><li>Every wrong code costs <b>1 minute</b>. Each room has one hint, which costs <b>2 minutes</b>.</li><li>The lamps at the top show how many rooms you have solved. Your game is saved in this browser.</li><li>Talk in English in your team!</li></ul>'+FACTS;

/* ================= ROOMS ================= */
var ROOMS = [
 {id:"weather", img:"ie-room1-weather.jpg", kick:"Room 1 · The weather station", title:"Why is the island getting warmer?",
  story:"The door of the weather station is open. Inside, rain drums on the window. On the desk, the meteorologist left five cards about the greenhouse effect, but the wind has mixed them up. Each card has a number stamped on it. Put the cards in the right order: the numbers then give you the code for the next door.",
  hint:"Start with the sun. The light must first reach the ground before the ground can give off heat. Humans come in at the very end.",
  type:"order",
  items:[["Sunlight passes through the atmosphere and reaches the Earth.","7"],["Land and oceans absorb most of the sunlight and warm up.","2"],["The warm surface gives off heat as infrared radiation.","9"],["Greenhouse gases trap part of this heat and send it back to the surface.","4"],["Humans add more greenhouse gases, so the greenhouse effect gets stronger and the Earth gets warmer.","6"]],
  lock:{t:"Door code", p:"Enter the five stamped numbers in the right order of the greenhouse effect.", labels:["1st","2nd","3rd","4th","5th"]},
  code:"72946", done:"The door clicks open. A gust of wind blows you towards the harbour."},
 {id:"harbour", img:"ie-room2-harbour.jpg", kick:"Room 2 · The harbour", title:"How high must the dyke be?",
  story:"Waves splash over the old stone dyke. The harbour master’s control box is locked. Next to it hangs a list with seven numbered processes. The code consists of the numbers of all processes that really make the sea level rise, from the smallest to the biggest number.",
  hint:"Only ice that lies on land adds new water to the sea. Ice that already floats in the water is like an ice cube in a glass. And remember: warm water needs more space.",
  type:"list",
  items:["Floating sea ice in the Arctic Ocean melts.","Ocean water expands when it gets warmer.","More rain falls over the ocean.","The ice sheet on Greenland melts.","Icebergs that are already in the sea melt.","Glaciers in the Alps melt.","The ice sheet of Antarctica melts."],
  lock:{t:"Control box", p:"The numbers of the processes that make the sea level rise, from smallest to biggest.", labels:["","","",""]},
  code:"2467", done:"The control box opens and the pumps start. The water in the harbour slowly goes down. Now: the power house!"},
 {id:"power", img:"ie-room3-powerhouse.jpg", kick:"Room 3 · The power house", title:"Every machine converts energy",
  story:"In the power house, an old poster on the wall lists six energy conversions. The machines in the room are still switched off. To restart them, the panel asks which conversion each machine performs. Find the number for each machine.",
  hint:"A solar cell makes electricity directly from light (not heat). A motor and a generator do opposite things: one makes movement from electricity, the other makes electricity from movement.",
  type:"poster",
  items:[["1","kinetic energy → electrical energy"],["2","light energy → heat"],["3","chemical energy → electrical energy"],["4","electrical energy → kinetic energy"],["5","light energy → electrical energy"],["6","chemical energy → heat and light"]],
  lock:{t:"Machine panel", p:"Which conversion does each machine perform? Enter the poster number.", labels:["solar cell","electric motor","battery (in use)","generator"]},
  code:"5431", done:"The machines hum. Solar panels, the small wind turbine and the water wheel are connected again. Only the control room is left."},
 {id:"control", img:"ie-room4-control.jpg", kick:"Room 4 · The control room", title:"Switch on the island",
  story:"The last room. Eight switches control the island’s energy system, and each one is labelled with a statement. Switch ON every statement that is true and leave the false ones OFF. Then pull the main lever. If the setting is wrong, the lamps show you how many switches are correct.",
  hint:"Exactly five statements are true. The white cloud above a cooling tower is water vapour, not smoke. And uranium is mined: it will run out one day.",
  type:"switch",
  items:[["Control rods absorb neutrons and can slow down the chain reaction.",true],["The white cloud from a cooling tower is smoke full of CO₂.",false],["Nuclear energy is a renewable energy.",false],["Mira Island should not build a tidal power plant, because the tide difference is only about 1 metre.",true],["Batteries can store solar electricity from the day for the night.",true],["A wind turbine produces electricity at any wind speed.",false],["Radioactive waste stays dangerous for thousands of years.",true],["Wind turbines near the bird reserve can be stopped during the bird migration.",true]],
  done:"The main lever clicks into place. One street lamp after the other lights up …"}
];

/* ================= STATE ================= */
var S = null, tick = null;
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ return null; } }
function left(){ return S.limit ? S.limit - (Date.now() - S.t0)/1000 - S.pen : Infinity; }
function used(){ return (Date.now() - S.t0)/1000 + S.pen; }

/* ================= START ================= */
function start(){
 stop();
 var saved = load();
 root.innerHTML = '<div class="ie-panel"><div class="ie-hero">'+img("ie-intro.jpg","A small island after a storm, with dark houses and a wind turbine standing still")+'<div class="cap"><small>Escape game · Unit 9</small><b>Island Escape: Power for Mira Island</b></div></div><div class="ie-body">'
  +'<p>Last night, a heavy storm hit <b>Mira Island</b>. The old diesel power plant is broken, the houses are dark, and the island’s new clean energy system is locked. You are the energy team that came by ship to help. Find your way through <b>four rooms</b>, solve the puzzles and switch the island back on before night falls.</p>'
  +FACTS
  +'<p>'+RULES+'</p>'
  +(saved && !saved.end ? '<p><button class="ie-btn" id="ie-res">Continue the saved game (room '+(saved.room+1)+')</button></p>' : '')
  +'<div class="ie-row" style="margin:12px 0"><label for="ie-name"><b>Team name</b></label><input class="ie-input" id="ie-name" maxlength="28" value="The Energy Team"></div>'
  +'<p style="margin:8px 0 6px"><b>Time</b></p><div class="ie-chips" id="ie-time"><button data-m="20">20 minutes · experts</button><button data-m="30" class="on">30 minutes</button><button data-m="45">45 minutes</button><button data-m="0">no time limit</button></div>'
  +'<p style="margin-top:18px"><button class="ie-btn" id="ie-go">Start the escape</button></p>'+bestTable()+'</div></div>';
 root.querySelector("#ie-time").addEventListener("click", function(e){ var b=e.target.closest("button"); if(!b) return; [].forEach.call(this.children,function(x){x.classList.toggle("on",x===b);}); });
 root.querySelector("#ie-go").addEventListener("click", function(){
  var m = +root.querySelector("#ie-time .on").dataset.m;
  S = {team:(root.querySelector("#ie-name").value.trim()||"The Energy Team").slice(0,28), limit:m*60, t0:Date.now(), pen:0, room:0, hints:[], wrong:0, end:null, order:shuffle([0,1,2,3,4])};
  save(); room();
 });
 var r = root.querySelector("#ie-res"); if (r) r.addEventListener("click", function(){ S = saved; room(); });
}
function bestTable(){
 var b = []; try{ b = JSON.parse(localStorage.getItem(BEST)) || []; }catch(e){}
 if (!b.length) return "";
 return '<h3 style="margin-top:20px">Best teams on this device</h3><table class="ie-best"><tr><th>Team</th><th>Time</th><th>Hints</th><th>Wrong codes</th></tr>'+b.slice(0,5).map(function(x){ return '<tr><td>'+esc(x.team)+'</td><td>'+mmss(x.time)+'</td><td>'+x.hints+'</td><td>'+x.wrong+'</td></tr>'; }).join("")+'</table>';
}

function help(){
 var d = document.createElement("div"); d.className = "ie-ov";
 d.innerHTML = '<div class="ie-ovbox" role="dialog" aria-modal="true">'+HOWTO+'<p style="text-align:right;margin:12px 0 0"><button class="ie-btn">Back to the game</button></p></div>';
 root.appendChild(d);
 var close = function(){ d.remove(); document.removeEventListener("keydown", k); };
 var k = function(e){ if (e.key === "Escape") close(); };
 d.addEventListener("click", function(e){ if (e.target === d || e.target.closest("button")) close(); });
 document.addEventListener("keydown", k); d.querySelector("button").focus();
}

/* ================= TIMER ================= */
function stop(){ if (tick) clearInterval(tick); tick = null; }
function bar(){
 var h = '<div class="ie-bar"><span class="ie-clock" id="ie-clock">'+(S.limit?mmss(left()):mmss(used()))+'</span><div class="ie-lamps">'
  + ROOMS.map(function(r,i){ return '<span class="ie-lamp'+(i<S.room?' on':'')+(i===S.room?' now':'')+'" title="'+esc(r.kick)+'">'+(i+1)+'</span>'; }).join("")
  +'</div><span class="ie-team">'+esc(S.team)+'</span><button class="ie-btn alt sm" id="ie-help" style="background:transparent;color:#fff;border-color:#8aa0ad">📖 Rules</button><button class="ie-btn alt sm" id="ie-quit" style="background:transparent;color:#fff;border-color:#8aa0ad">Restart</button></div>';
 return h;
}
function runClock(){
 stop();
 tick = setInterval(function(){
  var c = document.getElementById("ie-clock"); if (!c) return stop();
  if (S.limit) { var l = left(); c.textContent = mmss(l); c.classList.toggle("low", l < 120); if (l <= 0) { stop(); timeUp(); } }
  else c.textContent = mmss(used());
 }, 500);
}

/* ================= ROOM ================= */
function room(){
 if (S.end === "win") return win();
 if (S.limit && left() <= 0) return timeUp();
 var R = ROOMS[S.room];
 var h = bar() + '<div class="ie-panel"><div class="ie-hero">'+img(R.img, R.kick)+'<div class="cap"><small>'+esc(R.kick)+'</small><b>'+esc(R.title)+'</b></div></div><div class="ie-body"><p>'+esc(R.story)+'</p>';
 if (R.type === "order") {
  h += '<ol class="ie-steps" id="ie-order">' + S.order.map(function(k,pos){ return stepLi(R, k, pos); }).join("") + '</ol>';
 } else if (R.type === "list") {
  h += '<ul class="ie-list">'+R.items.map(function(t,i){ return '<li><span class="n">'+(i+1)+'</span><span>'+esc(t)+'</span></li>'; }).join("")+'</ul>';
 } else if (R.type === "poster") {
  h += '<div class="ie-poster" aria-label="Poster with six energy conversions">'+R.items.map(function(x){ return '<div><b>'+x[0]+'</b><span>'+esc(x[1])+'</span></div>'; }).join("")+'</div>';
 } else if (R.type === "switch") {
  h += '<div class="ie-sw" id="ie-sw">'+R.items.map(function(x,i){ return '<label><input type="checkbox" data-i="'+i+'"><span class="tg"></span><span>'+esc(x[0])+'</span></label>'; }).join("")+'</div>';
 }
 h += '<div id="ie-hintbox">'+(S.hints.indexOf(S.room)>=0?'<div class="ie-hint"><b>Hint:</b> '+esc(R.hint)+'</div>':'')+'</div>';
 if (R.type === "switch") {
  h += '<div class="ie-lock"><h4>Main lever</h4><p>Set the switches, then pull the lever. Wrong setting: −1 minute.</p><div class="ie-lever"><button id="ie-pull">⏻ PULL THE LEVER</button><div class="ie-meter" id="ie-meter" aria-live="polite">'+R.items.map(function(){ return '<i></i>'; }).join("")+'</div></div><div class="ie-msg" id="ie-msg" aria-live="polite"></div></div>';
 } else {
  h += '<div class="ie-lock" id="ie-lock"><h4>🔒 '+esc(R.lock.t)+'</h4><p>'+esc(R.lock.p)+'</p><div class="ie-digits">'
   + R.lock.labels.map(function(l,i){ return '<label>'+'<input inputmode="numeric" maxlength="1" pattern="[0-9]" aria-label="Digit '+(i+1)+(l?' – '+esc(l):'')+'" data-d="'+i+'">'+(l?esc(l):'')+'</label>'; }).join("")
   + '<button class="ie-btn" id="ie-try" style="background:#ffd55a;color:#20303a;margin-left:6px">Open</button></div><div class="ie-msg" id="ie-msg" aria-live="polite"></div></div>';
 }
 h += '<div class="ie-row" style="justify-content:space-between;margin-top:12px"><button class="ie-btn alt sm" id="ie-hint"'+(S.hints.indexOf(S.room)>=0?' disabled':'')+'>💡 Hint (−2 minutes)</button><span style="color:var(--ie-mut);font-size:14px">Wrong codes so far: '+S.wrong+'</span></div></div></div>';
 root.innerHTML = h;
 runClock();
 root.querySelector("#ie-help").onclick = help;
 root.querySelector("#ie-quit").onclick = function(){ if (confirm("Restart the escape game? Your progress will be lost.")) { try{localStorage.removeItem(KEY);}catch(e){} start(); } };
 root.querySelector("#ie-hint").onclick = function(){ if (S.hints.indexOf(S.room) < 0) { S.hints.push(S.room); S.pen += 120; save(); this.disabled = true; document.getElementById("ie-hintbox").innerHTML = '<div class="ie-hint"><b>Hint:</b> '+esc(R.hint)+'</div>'; } };
 if (R.type === "order") wireOrder(R);
 if (R.type === "switch") root.querySelector("#ie-pull").onclick = pull;
 else wireLock(R);
 window.scrollTo({top: root.getBoundingClientRect().top + window.scrollY - 80, behavior:"smooth"});
}
function stepLi(R, k, pos){
 return '<li data-k="'+k+'"><span class="n">'+(pos+1)+'</span><span class="tx">'+esc(R.items[k][0])+'</span><span class="dg" title="stamped number">'+R.items[k][1]+'</span><span class="mv"><button data-m="-1" aria-label="Move up">▲</button><button data-m="1" aria-label="Move down">▼</button></span></li>';
}
function wireOrder(R){
 var ol = root.querySelector("#ie-order");
 ol.addEventListener("click", function(e){
  var b = e.target.closest("button[data-m]"); if (!b) return;
  var li = b.closest("li"), pos = [].indexOf.call(ol.children, li), to = pos + (+b.dataset.m);
  if (to < 0 || to >= S.order.length) return;
  var t = S.order[pos]; S.order[pos] = S.order[to]; S.order[to] = t; save();
  ol.innerHTML = S.order.map(function(k,p){ return stepLi(R,k,p); }).join("");
  var nb = ol.children[to].querySelector('button[data-m="'+b.dataset.m+'"]'); if (nb) nb.focus();
 });
}
function wireLock(R){
 var ins = [].slice.call(root.querySelectorAll(".ie-digits input"));
 ins.forEach(function(inp, i){
  inp.addEventListener("input", function(){ inp.value = inp.value.replace(/\D/g,"").slice(-1); if (inp.value && ins[i+1]) ins[i+1].focus(); });
  inp.addEventListener("keydown", function(e){ if (e.key === "Backspace" && !inp.value && ins[i-1]) ins[i-1].focus(); if (e.key === "Enter") tryCode(R, ins); });
 });
 root.querySelector("#ie-try").onclick = function(){ tryCode(R, ins); };
}
function tryCode(R, ins){
 var code = ins.map(function(x){ return x.value; }).join(""), msg = document.getElementById("ie-msg");
 if (code.length < ins.length) { msg.className = "ie-msg no"; msg.textContent = "Please fill in all "+ins.length+" digits."; return; }
 if (code === R.code) return solved(R);
 S.wrong++; S.pen += 60; save();
 var lock = document.getElementById("ie-lock"); lock.classList.remove("ie-shake"); void lock.offsetWidth; lock.classList.add("ie-shake");
 msg.className = "ie-msg no"; msg.textContent = "Wrong code! −1 minute. Check the puzzle again.";
}
function pull(){
 var R = ROOMS[S.room], boxes = [].slice.call(root.querySelectorAll("#ie-sw input"));
 var right = boxes.filter(function(b){ return b.checked === R.items[+b.dataset.i][1]; }).length;
 var lamps = root.querySelectorAll("#ie-meter i");
 [].forEach.call(lamps, function(l,i){ l.classList.toggle("on", i < right); });
 var msg = document.getElementById("ie-msg");
 if (right === R.items.length) return solved(R);
 S.wrong++; S.pen += 60; save();
 msg.className = "ie-msg no"; msg.textContent = right+" of "+R.items.length+" switches are correct. −1 minute. Which statements are you not sure about?";
}
function solved(R){
 stop();
 var msg = document.getElementById("ie-msg"); msg.className = "ie-msg ok"; msg.textContent = "✔ Correct!";
 S.room++;
 if (S.room >= ROOMS.length) { S.end = "win"; S.time = used(); saveBest(); save(); setTimeout(win, 900); return; }
 save();
 var lamp = root.querySelectorAll(".ie-lamp")[S.room-1]; if (lamp) lamp.classList.add("on");
 var body = root.querySelector(".ie-body");
 body.insertAdjacentHTML("beforeend", '<div class="ie-done">'+esc(R.done)+'</div><p><button class="ie-btn" id="ie-next">Go to room '+(S.room+1)+' →</button></p>');
 runClock();
 var nb = document.getElementById("ie-next"); nb.focus(); nb.onclick = room;
}
function saveBest(){
 var b = []; try{ b = JSON.parse(localStorage.getItem(BEST)) || []; }catch(e){}
 b.push({team:S.team, time:Math.round(S.time), hints:S.hints.length, wrong:S.wrong});
 b.sort(function(x,y){ return x.time - y.time; });
 try{ localStorage.setItem(BEST, JSON.stringify(b.slice(0,10))); }catch(e){}
}
function win(){
 stop();
 root.innerHTML = '<div class="ie-panel"><div class="ie-hero">'+img("ie-success.jpg","The island at night with all lights on")+'<div class="cap"><small>Mission complete</small><b>Mira Island is shining again!</b></div></div><div class="ie-body">'
  +'<p>Well done, <b>'+esc(S.team)+'</b>! The solar panels, the wind turbines and the batteries supply the island with clean electricity, and the old diesel plant can stay switched off.</p>'
  +'<div class="ie-stats"><div><b>'+mmss(S.time)+'</b>time (incl. penalties)</div><div><b>'+S.hints.length+'</b>hints used</div><div><b>'+S.wrong+'</b>wrong codes</div></div>'
  +'<div class="ie-fact"><b>What you used in this game</b><ul><li>Room 1: the greenhouse effect (book p. 119)</li><li>Room 2: rising sea levels (pp. 122–123)</li><li>Room 3: converting energy (pp. 124–126)</li><li>Room 4: nuclear power, wind power and the island project (pp. 129–131)</li></ul></div>'
  +'<p><b>Talk about it:</b> Which energy mix would you recommend for Mira Island, and why? Practise your answer in English with your team.</p>'
  +'<p><button class="ie-btn" id="ie-again">Play again</button></p>'+bestTable()+'</div></div>';
 root.querySelector("#ie-again").onclick = function(){ try{localStorage.removeItem(KEY);}catch(e){} start(); };
}
function timeUp(){
 stop();
 root.innerHTML = '<div class="ie-panel"><div class="ie-hero">'+img("ie-timeup.jpg","The dark island at night")+'<div class="cap"><small>Time is up</small><b>Night has fallen on Mira Island</b></div></div><div class="ie-body">'
  +'<p>The island is still dark, but you got far: <b>'+S.room+' of 4 rooms</b> are solved. You can continue without a time limit to finish the mission, or start again.</p>'
  +'<p class="ie-row"><button class="ie-btn" id="ie-cont">Continue without time limit</button><button class="ie-btn alt" id="ie-again">Start again</button></p></div></div>';
 root.querySelector("#ie-cont").onclick = function(){ S.limit = 0; save(); room(); };
 root.querySelector("#ie-again").onclick = function(){ try{localStorage.removeItem(KEY);}catch(e){} start(); };
}
start();
})();
</script>
